name: Update NFL Pregame Odds

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 12-23 * * 0"
    - cron: "*/5 0-6 * * 1"
    - cron: "*/5 22-23 * * 1"
    - cron: "*/5 0-6 * * 2"
    - cron: "*/5 22-23 * * 4"
    - cron: "*/5 0-6 * * 5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture ESPN NFL pregame odds
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          OUT = Path("closing-lines.json")

          ESPN = (
              "https://site.api.espn.com/apis/site/v2/"
              "sports/football/nfl/scoreboard"
          )

          ET = ZoneInfo("America/New_York")


          def fetch_text(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 FootballFairPriceLookup/1.0",

                      "Accept":
                          "application/json,text/plain,*/*",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:

                  return response.read().decode(
                      "utf-8",
                      errors="replace",
                  )


          def fetch_json(url):
              text = fetch_text(
                  url
              )

              if not text.strip():
                  raise RuntimeError(
                      "Empty response from "
                      +
                      url
                  )

              try:
                  return json.loads(
                      text
                  )

              except Exception:
                  print(
                      "BAD JSON FROM:",
                      url,
                  )

                  print(
                      text[:500]
                  )

                  raise


          def valid_json(text):
              if not text or not text.strip():
                  return None

              try:
                  data = json.loads(
                      text
                  )

              except Exception:
                  return None

              if not isinstance(
                  data,
                  dict,
              ):
                  return None

              if not isinstance(
                  data.get(
                      "games",
                      {},
                  ),
                  dict,
              ):
                  return None

              return data


          def recover_existing():

              if OUT.exists():

                  current = valid_json(
                      OUT.read_text(
                          errors="replace"
                      )
                  )

                  if current is not None:

                      print(
                          "Current closing-lines.json valid."
                      )

                      return current


              print(
                  "Current JSON invalid or empty; "
                  "searching Git history."
              )


              result = subprocess.run(
                  [
                      "git",
                      "log",
                      "--format=%H",
                      "--",
                      "closing-lines.json",
                  ],
                  capture_output=True,
                  text=True,
              )


              for sha in result.stdout.splitlines():

                  sha = sha.strip()

                  if not sha:
                      continue


                  show = subprocess.run(
                      [
                          "git",
                          "show",
                          f"{sha}:closing-lines.json",
                      ],
                      capture_output=True,
                      text=True,
                  )


                  if show.returncode != 0:
                      continue


                  recovered = valid_json(
                      show.stdout
                  )


                  if (
                      recovered is not None
                      and
                      recovered.get(
                          "games"
                      )
                  ):

                      print(
                          "Recovered",
                          len(
                              recovered[
                                  "games"
                              ]
                          ),
                          "games from",
                          sha,
                      )

                      return recovered


              return {
                  "updated_at": None,
                  "games": {},
              }


          def parse_american(
              value
          ):

              if value is None:
                  return None


              if isinstance(
                  value,
                  (
                      int,
                      float,
                  ),
              ):

                  value = int(
                      value
                  )


              else:

                  text = str(
                      value
                  ).strip()

                  text = (
                      text
                      .replace(
                          "−",
                          "-"
                      )
                      .replace(
                          "–",
                          "-"
                      )
                      .replace(
                          "—",
                          "-"
                      )
                  )


                  if text.upper() in (
                      "EVEN",
                      "EV",
                  ):

                      return 100


                  try:

                      value = int(
                          text
                      )

                  except Exception:

                      return None


              if value == 0:

                  return None


              return value


          def nested_close_odds(
              moneyline,
              side,
          ):

              side_data = (
                  moneyline.get(
                      side
                  )
                  or
                  {}
              )


              close_data = (
                  side_data.get(
                      "close"
                  )
                  or
                  {}
              )


              value = close_data.get(
                  "odds"
              )


              if value is None:

                  value = close_data.get(
                      "moneyLine"
                  )


              if value is None:

                  value = close_data.get(
                      "moneyline"
                  )


              if value is None:

                  value = side_data.get(
                      "odds"
                  )


              if value is None:

                  value = side_data.get(
                      "moneyLine"
                  )


              if value is None:

                  value = side_data.get(
                      "moneyline"
                  )


              return parse_american(
                  value
              )


          def extract_espn_moneyline(
              competition
          ):

              odds_list = (
                  competition.get(
                      "odds"
                  )
                  or
                  []
              )


              for item in odds_list:

                  # -----------------------------
                  # Current ESPN structure
                  #
                  # odds
                  #   moneyline
                  #     away
                  #       close
                  #         odds
                  #     home
                  #       close
                  #         odds
                  # -----------------------------

                  moneyline = (
                      item.get(
                          "moneyline"
                      )
                      or
                      item.get(
                          "moneyLine"
                      )
                      or
                      {}
                  )


                  if isinstance(
                      moneyline,
                      dict,
                  ):

                      away_ml = nested_close_odds(
                          moneyline,
                          "away",
                      )


                      home_ml = nested_close_odds(
                          moneyline,
                          "home",
                      )


                      if (
                          away_ml is not None
                          and
                          home_ml is not None
                      ):

                          return (
                              away_ml,
                              home_ml,
                              "ESPN moneyline close",
                          )


                  # -----------------------------
                  # Older ESPN structure
                  # -----------------------------

                  away = (
                      item.get(
                          "awayTeamOdds"
                      )
                      or
                      {}
                  )


                  home = (
                      item.get(
                          "homeTeamOdds"
                      )
                      or
                      {}
                  )


                  away_ml = parse_american(
                      away.get(
                          "moneyLine"
                      )
                      or
                      away.get(
                          "moneyline"
                      )
                  )


                  home_ml = parse_american(
                      home.get(
                          "moneyLine"
                      )
                      or
                      home.get(
                          "moneyline"
                      )
                  )


                  if (
                      away_ml is not None
                      and
                      home_ml is not None
                  ):

                      return (
                          away_ml,
                          home_ml,
                          "ESPN team moneyline",
                      )


              return None


          def implied_probability(
              moneyline
          ):

              moneyline = int(
                  moneyline
              )


              if moneyline < 0:

                  return (
                      -moneyline
                      /
                      (
                          -moneyline
                          +
                          100
                      )
                  )


              return (
                  100
                  /
                  (
                      moneyline
                      +
                      100
                  )
              )


          def no_vig_probabilities(
              away_ml,
              home_ml,
          ):

              away_raw = implied_probability(
                  away_ml
              )


              home_raw = implied_probability(
                  home_ml
              )


              total = (
                  away_raw
                  +
                  home_raw
              )


              return (
                  away_raw
                  /
                  total,

                  home_raw
                  /
                  total,
              )


          data = recover_existing()


          games = data.setdefault(
              "games",
              {},
          )


          original_games = json.dumps(
              games,
              sort_keys=True,
          )


          now_utc = datetime.now(
              timezone.utc
          )


          today_et = datetime.now(
              ET
          ).strftime(
              "%Y%m%d"
          )


          scoreboard_url = (
              ESPN
              +
              "?limit=100&dates="
              +
              today_et
          )


          scoreboard = fetch_json(
              scoreboard_url
          )


          events = scoreboard.get(
              "events",
              [],
          )


          print(
              "ESPN events:",
              len(
                  events
              ),
          )


          changed = 0


          for event in events:

              competitions = (
                  event.get(
                      "competitions"
                  )
                  or
                  []
              )


              if not competitions:
                  continue


              competition = competitions[
                  0
              ]


              game_id = str(
                  event.get(
                      "id"
                  )
              )


              competitors = (
                  competition.get(
                      "competitors",
                      [],
                  )
              )


              away = next(
                  (
                      team
                      for team in competitors
                      if team.get(
                          "homeAway"
                      )
                      ==
                      "away"
                  ),
                  None,
              )


              home = next(
                  (
                      team
                      for team in competitors
                      if team.get(
                          "homeAway"
                      )
                      ==
                      "home"
                  ),
                  None,
              )


              if not away or not home:
                  continue


              away_name = (
                  away
                  .get(
                      "team",
                      {},
                  )
                  .get(
                      "displayName"
                  )
              )


              home_name = (
                  home
                  .get(
                      "team",
                      {},
                  )
                  .get(
                      "displayName"
                  )
              )


              if (
                  not away_name
                  or
                  not home_name
              ):

                  continue


              state = (
                  competition
                  .get(
                      "status",
                      {},
                  )
                  .get(
                      "type",
                      {},
                  )
                  .get(
                      "state"
                  )
              )


              kickoff = datetime.fromisoformat(
                  event[
                      "date"
                  ].replace(
                      "Z",
                      "+00:00",
                  )
              )


              existing = games.get(
                  game_id
              )


              # Preserve previously verified entries
              # from other sources.

              if (
                  existing
                  and
                  existing.get(
                      "source"
                  )
                  not in (
                      "ESPN moneyline close",
                      "ESPN team moneyline",
                      "ESPN pregame moneyline",
                  )
              ):

                  print(
                      "Preserving verified historical:",
                      game_id,
                      away_name,
                      "at",
                      home_name,
                  )

                  continue


              odds = extract_espn_moneyline(
                  competition
              )


              if odds is None:

                  print(
                      "NO ESPN MONEYLINE:",
                      game_id,
                      away_name,
                      "at",
                      home_name,
                      "| state:",
                      state,
                  )

                  continue


              away_ml, home_ml, source = odds


              away_prob, home_prob = (
                  no_vig_probabilities(
                      away_ml,
                      home_ml,
                  )
              )


              if home_prob >= away_prob:

                  favorite = (
                      home_name
                  )

                  favorite_probability = (
                      home_prob
                  )


              else:

                  favorite = (
                      away_name
                  )

                  favorite_probability = (
                      away_prob
                  )


              # Before kickoff:
              # continue refreshing the stored line.
              #
              # At/after kickoff:
              # freeze the first available pair.

              locked = (
                  state in (
                      "in",
                      "post",
                  )
                  or
                  now_utc >= kickoff
              )


              if (
                  existing
                  and
                  existing.get(
                      "locked"
                  )
                  is True
              ):

                  print(
                      "Already locked:",
                      game_id,
                  )

                  continue


              record = {

                  "event_id":
                      game_id,

                  "date":
                      kickoff
                      .astimezone(
                          ET
                      )
                      .strftime(
                          "%Y-%m-%d"
                      ),

                  "away":
                      away_name,

                  "home":
                      home_name,

                  "away_ml":
                      away_ml,

                  "home_ml":
                      home_ml,

                  "away_fair_probability":
                      round(
                          away_prob,
                          6,
                      ),

                  "home_fair_probability":
                      round(
                          home_prob,
                          6,
                      ),

                  "pregame_favorite":
                      favorite,

                  "favorite_probability":
                      round(
                          favorite_probability,
                          6,
                      ),

                  "source":
                      source,

                  "captured_at":
                      now_utc.isoformat(),

                  "kickoff":
                      kickoff.isoformat(),

                  "locked":
                      locked,
              }


              old_serialized = (
                  json.dumps(
                      existing,
                      sort_keys=True,
                  )
                  if existing
                  else
                  None
              )


              new_serialized = json.dumps(
                  record,
                  sort_keys=True,
              )


              if (
                  old_serialized
                  !=
                  new_serialized
              ):

                  games[
                      game_id
                  ] = record


                  changed += 1


                  print(
                      "SAVED:",
                      game_id,
                      away_name,
                      away_ml,
                      "/",
                      home_name,
                      home_ml,
                      "| favorite:",
                      favorite,
                      round(
                          favorite_probability
                          *
                          100,
                          1,
                      ),
                      "%",
                      "| locked:",
                      locked,
                  )


          new_games = json.dumps(
              games,
              sort_keys=True,
          )


          if (
              new_games
              !=
              original_games
          ):

              data[
                  "updated_at"
              ] = (
                  now_utc.isoformat()
              )


              OUT.write_text(
                  json.dumps(
                      data,
                      indent=2,
                      sort_keys=True,
                  )
                  +
                  "\n"
              )


              print(
                  "closing-lines.json updated."
              )


          else:

              print(
                  "No JSON changes."
              )


          print(
              "Records changed:",
              changed,
          )


          print(
              "Total stored:",
              len(
                  games
              ),
          )

          PY


      - name: Commit only if JSON changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- closing-lines.json)" ]; then
            echo "No JSON changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add closing-lines.json

          git commit -m "Capture ESPN NFL pregame odds"

          git push
