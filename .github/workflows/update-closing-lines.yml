name: Update NFL Pregame Odds

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 13-23 * * 0"
    - cron: "*/5 22-23 * * 1,4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find and append verified NFL pregame odds
        shell: bash
        run: |
          python - <<'PY'

          import json
          import re
          import subprocess
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo


          OUT = Path("closing-lines.json")

          ESPN = (
              "https://site.api.espn.com/apis/site/v2/"
              "sports/football/nfl/scoreboard"
          )

          JINA = "https://r.jina.ai/http://"

          DDG = "https://html.duckduckgo.com/html/?q="


          # ------------------------------------------------
          # BASIC FETCH
          # ------------------------------------------------

          def fetch_text(url):

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 "
                          "(Football Fair Price Lookup)",
                      "Accept":
                          "text/html,application/json,text/plain,*/*",
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30,
              ) as r:

                  return r.read().decode(
                      "utf-8",
                      errors="replace",
                  )


          def fetch_json(url):

              text = fetch_text(url)

              if not text.strip():
                  raise RuntimeError(
                      "Empty response: " + url
                  )

              return json.loads(text)


          # ------------------------------------------------
          # MONEYLINE MATH
          # ------------------------------------------------

          def implied(ml):

              ml = int(ml)

              if ml < 0:
                  return (-ml) / ((-ml) + 100)

              return 100 / (ml + 100)


          def fair_pair(
              away_ml,
              home_ml,
          ):

              a = implied(away_ml)
              h = implied(home_ml)

              total = a + h

              return (
                  a / total,
                  h / total,
              )


          # ------------------------------------------------
          # PRESERVE / RECOVER EXISTING JSON
          # ------------------------------------------------

          def valid_json(text):

              try:
                  data = json.loads(text)
              except Exception:
                  return None

              if not isinstance(data, dict):
                  return None

              if not isinstance(
                  data.get("games", {}),
                  dict,
              ):
                  return None

              return data


          def recover_existing():

              if OUT.exists():

                  current = valid_json(
                      OUT.read_text(
                          errors="replace"
                      )
                  )

                  if current is not None:

                      print(
                          "Existing closing-lines.json valid."
                      )

                      return current


              print(
                  "Current closing-lines.json invalid."
              )

              print(
                  "Recovering last valid copy from Git history."
              )


              result = subprocess.run(
                  [
                      "git",
                      "log",
                      "--format=%H",
                      "--",
                      "closing-lines.json",
                  ],
                  capture_output=True,
                  text=True,
              )


              for sha in result.stdout.splitlines():

                  sha = sha.strip()

                  if not sha:
                      continue


                  show = subprocess.run(
                      [
                          "git",
                          "show",
                          f"{sha}:closing-lines.json",
                      ],
                      capture_output=True,
                      text=True,
                  )


                  if show.returncode != 0:
                      continue


                  old = valid_json(
                      show.stdout
                  )


                  if (
                      old
                      and
                      old.get("games")
                  ):

                      print(
                          "Recovered",
                          len(old["games"]),
                          "games from",
                          sha,
                      )

                      return old


              return {
                  "updated_at": None,
                  "games": {},
              }


          # ------------------------------------------------
          # ESPN EMBEDDED PREGAME ODDS
          # ------------------------------------------------

          def espn_odds(
              competition
          ):

              odds_list = (
                  competition.get("odds")
                  or
                  []
              )


              for odds in odds_list:

                  away = (
                      odds.get(
                          "awayTeamOdds"
                      )
                      or
                      {}
                  )

                  home = (
                      odds.get(
                          "homeTeamOdds"
                      )
                      or
                      {}
                  )


                  away_ml = (
                      away.get("moneyLine")
                      or
                      away.get("moneyline")
                  )

                  home_ml = (
                      home.get("moneyLine")
                      or
                      home.get("moneyline")
                  )


                  try:

                      away_ml = int(
                          away_ml
                      )

                      home_ml = int(
                          home_ml
                      )

                  except Exception:

                      continue


                  if (
                      away_ml != 0
                      and
                      home_ml != 0
                  ):

                      return (
                          away_ml,
                          home_ml,
                      )


              return None


          # ------------------------------------------------
          # SEARCH PUBLIC WEB
          # ------------------------------------------------

          def search_urls(
              query,
              domain,
          ):

              url = (
                  DDG
                  +
                  urllib.parse.quote(
                      query
                  )
              )


              try:
                  html = fetch_text(url)

              except Exception as exc:

                  print(
                      "Search failed:",
                      exc,
                  )

                  return []


              urls = []


              # Direct links

              for match in re.findall(
                  r'https?://[^"\s<>]+',
                  html,
              ):

                  match = (
                      match
                      .replace("&amp;", "&")
                  )

                  if domain in match:

                      if match not in urls:
                          urls.append(match)


              # DuckDuckGo redirect URLs

              for encoded in re.findall(
                  r'uddg=([^"&]+)',
                  html,
              ):

                  candidate = urllib.parse.unquote(
                      encoded
                  )

                  if domain in candidate:

                      if candidate not in urls:
                          urls.append(candidate)


              return urls[:8]


          # ------------------------------------------------
          # ACTION NETWORK PARSER
          # ------------------------------------------------

          def nickname(name):

              return name.split()[-1]


          def parse_action_network(
              text,
              away_name,
              home_name,
          ):

              text = (
                  text
                  .replace("−", "-")
                  .replace("–", "-")
                  .replace("—", "-")
              )


              away_nick = nickname(
                  away_name
              )

              home_nick = nickname(
                  home_name
              )


              # Require both teams and moneyline section

              if not re.search(
                  re.escape(away_nick),
                  text,
                  flags=re.I,
              ):
                  return None


              if not re.search(
                  re.escape(home_nick),
                  text,
                  flags=re.I,
              ):
                  return None


              if not re.search(
                  r"Moneyline",
                  text,
                  flags=re.I,
              ):
                  return None


              def team_ml(team):

                  #
                  # Action Network Jina text currently
                  # renders rows like:
                  #
                  # Packers 4-2 | +2.5 | +3.5-106 |
                  # o55.5-105 | +171
                  #

                  pattern = re.compile(
                      rf"^{re.escape(team)}"
                      rf"[^\n]*"
                      rf"\|\s*"
                      rf"([+-]\d+)"
                      rf"\s*$",
                      flags=re.I | re.M,
                  )


                  match = pattern.search(
                      text
                  )


                  if match:

                      return int(
                          match.group(1)
                      )


                  return None


              away_ml = team_ml(
                  away_nick
              )

              home_ml = team_ml(
                  home_nick
              )


              if (
                  away_ml is None
                  or
                  home_ml is None
              ):
                  return None


              return (
                  away_ml,
                  home_ml,
              )


          # ------------------------------------------------
          # FIND ACTION NETWORK GAME
          # ------------------------------------------------

          def action_network_lookup(
              away_name,
              home_name,
              game_date,
          ):

              query = (
                  'site:actionnetwork.com/nfl-game '
                  f'"{away_name}" '
                  f'"{home_name}" '
                  f'"{game_date}"'
              )


              urls = search_urls(
                  query,
                  "actionnetwork.com/nfl-game",
              )


              print(
                  "Action Network candidates:",
                  len(urls),
              )


              for url in urls:

                  clean_url = (
                      url.split("?")[0]
                  )


                  reader_url = (
                      JINA
                      +
                      clean_url.replace(
                          "https://",
                          ""
                      )
                  )


                  try:

                      text = fetch_text(
                          reader_url
                      )

                  except Exception:

                      continue


                  result = parse_action_network(
                      text,
                      away_name,
                      home_name,
                  )


                  if result:

                      return (
                          result[0],
                          result[1],
                          clean_url,
                      )


              return None


          # ------------------------------------------------
          # COVERS FALLBACK
          # ------------------------------------------------

          def parse_covers(
              text,
              away_name,
              home_name,
          ):

              text = (
                  text
                  .replace("−", "-")
                  .replace("–", "-")
                  .replace("—", "-")
              )


              away_nick = nickname(
                  away_name
              )

              home_nick = nickname(
                  home_name
              )


              if not re.search(
                  r"Moneyline",
                  text,
                  flags=re.I,
              ):
                  return None


              #
              # Covers often exposes probabilities rather
              # than American odds. We ONLY accept it if
              # actual +/- American moneylines are present.
              #

              def find_ml(team):

                  patterns = [

                      rf"{re.escape(team)}"
                      rf"[^\n]{{0,100}}"
                      rf"([+-]\d{{3,4}})",

                      rf"([+-]\d{{3,4}})"
                      rf"[^\n]{{0,100}}"
                      rf"{re.escape(team)}",

                  ]


                  for pattern in patterns:

                      m = re.search(
                          pattern,
                          text,
                          flags=re.I,
                      )

                      if m:

                          return int(
                              m.group(1)
                          )


                  return None


              away_ml = find_ml(
                  away_nick
              )

              home_ml = find_ml(
                  home_nick
              )


              if (
                  away_ml is None
                  or
                  home_ml is None
              ):

                  return None


              return (
                  away_ml,
                  home_ml,
              )


          def covers_lookup(
              away_name,
              home_name,
              game_date,
          ):

              query = (
                  'site:covers.com/sport/football/nfl/matchup '
                  f'"{away_name}" '
                  f'"{home_name}" '
                  f'"{game_date}"'
              )


              urls = search_urls(
                  query,
                  "covers.com/sport/football/nfl/matchup",
              )


              for url in urls:

                  clean_url = (
                      url.split("?")[0]
                  )


                  reader_url = (
                      JINA
                      +
                      clean_url.replace(
                          "https://",
                          ""
                      )
                  )


                  try:

                      text = fetch_text(
                          reader_url
                      )

                  except Exception:

                      continue


                  result = parse_covers(
                      text,
                      away_name,
                      home_name,
                  )


                  if result:

                      return (
                          result[0],
                          result[1],
                          clean_url,
                      )


              return None


          # ------------------------------------------------
          # LOAD EXISTING DATABASE
          # ------------------------------------------------

          data = recover_existing()

          games = data.setdefault(
              "games",
              {},
          )


          original_games = json.dumps(
              games,
              sort_keys=True,
          )


          # ------------------------------------------------
          # TODAY'S ESPN GAMES
          # ------------------------------------------------

          now_et = datetime.now(
              ZoneInfo(
                  "America/New_York"
              )
          )


          today = now_et.strftime(
              "%Y%m%d"
          )


          scoreboard = fetch_json(
              ESPN
              +
              "?limit=100&dates="
              +
              today
          )


          print(
              "ESPN events:",
              len(
                  scoreboard.get(
                      "events",
                      [],
                  )
              ),
          )


          added = 0


          # ------------------------------------------------
          # PROCESS EACH STARTED GAME
          # ------------------------------------------------

          for event in scoreboard.get(
              "events",
              [],
          ):

              comps = (
                  event.get(
                      "competitions"
                  )
                  or
                  []
              )


              if not comps:
                  continue


              competition = comps[0]


              state = (
                  competition
                  .get(
                      "status",
                      {},
                  )
                  .get(
                      "type",
                      {},
                  )
                  .get(
                      "state"
                  )
              )


              #
              # Absolutely no line capture
              # before kickoff.
              #

              if state not in (
                  "in",
                  "post",
              ):
                  continue


              game_id = str(
                  event.get("id")
              )


              #
              # Never overwrite a verified game.
              #

              if game_id in games:

                  print(
                      "Already stored:",
                      game_id,
                  )

                  continue


              competitors = (
                  competition.get(
                      "competitors",
                      []
                  )
              )


              away = next(
                  (
                      x
                      for x in competitors
                      if x.get(
                          "homeAway"
                      )
                      ==
                      "away"
                  ),
                  None,
              )


              home = next(
                  (
                      x
                      for x in competitors
                      if x.get(
                          "homeAway"
                      )
                      ==
                      "home"
                  ),
                  None,
              )


              if not away or not home:
                  continue


              away_name = (
                  away
                  .get(
                      "team",
                      {},
                  )
                  .get(
                      "displayName"
                  )
              )


              home_name = (
                  home
                  .get(
                      "team",
                      {},
                  )
                  .get(
                      "displayName"
                  )
              )


              kickoff = datetime.fromisoformat(
                  event["date"].replace(
                      "Z",
                      "+00:00",
                  )
              )


              game_date = kickoff.astimezone(
                  ZoneInfo(
                      "America/New_York"
                  )
              ).strftime(
                  "%B %d %Y"
              )


              print()
              print(
                  "LOOKUP:",
                  away_name,
                  "at",
                  home_name,
              )


              result = None
              source = None
              source_url = None


              # --------------------------------
              # SOURCE 1: ESPN
              # --------------------------------

              result = espn_odds(
                  competition
              )


              if result:

                  source = (
                      "ESPN pregame moneyline"
                  )

                  source_url = (
                      "ESPN scoreboard"
                  )


              # --------------------------------
              # SOURCE 2: ACTION NETWORK
              # --------------------------------

              if result is None:

                  action = action_network_lookup(
                      away_name,
                      home_name,
                      game_date,
                  )


                  if action:

                      result = (
                          action[0],
                          action[1],
                      )

                      source = (
                          "Action Network pregame moneyline"
                      )

                      source_url = action[
                          2
                      ]


              # --------------------------------
              # SOURCE 3: COVERS
              # --------------------------------

              if result is None:

                  covers = covers_lookup(
                      away_name,
                      home_name,
                      game_date,
                  )


                  if covers:

                      result = (
                          covers[0],
                          covers[1],
                      )

                      source = (
                          "Covers pregame moneyline"
                      )

                      source_url = covers[
                          2
                      ]


              # --------------------------------
              # NOTHING VERIFIED
              # --------------------------------

              if result is None:

                  print(
                      "PREGAME_ODDS_UNAVAILABLE"
                  )

                  continue


              away_ml, home_ml = result


              away_fair, home_fair = (
                  fair_pair(
                      away_ml,
                      home_ml,
                  )
              )


              if home_fair >= away_fair:

                  favorite = home_name
                  favorite_probability = home_fair

              else:

                  favorite = away_name
                  favorite_probability = away_fair


              games[
                  game_id
              ] = {

                  "event_id":
                      game_id,

                  "away":
                      away_name,

                  "home":
                      home_name,

                  "away_ml":
                      away_ml,

                  "home_ml":
                      home_ml,

                  "away_fair_probability":
                      round(
                          away_fair,
                          6,
                      ),

                  "home_fair_probability":
                      round(
                          home_fair,
                          6,
                      ),

                  "pregame_favorite":
                      favorite,

                  "favorite_probability":
                      round(
                          favorite_probability,
                          6,
                      ),

                  "source":
                      source,

                  "source_url":
                      source_url,

                  "captured_at":
                      datetime.now(
                          timezone.utc
                      ).isoformat(),

              }


              added += 1


              print(
                  "SAVED:",
                  away_name,
                  away_ml,
                  "/",
                  home_name,
                  home_ml,
              )

              print(
                  "SOURCE:",
                  source,
              )


          # ------------------------------------------------
          # WRITE ONLY IF CHANGED
          # ------------------------------------------------

          new_games = json.dumps(
              games,
              sort_keys=True,
          )


          current_is_valid = (
              OUT.exists()
              and
              valid_json(
                  OUT.read_text(
                      errors="replace"
                  )
              )
              is not None
          )


          if (
              new_games
              !=
              original_games
              or
              not current_is_valid
          ):

              data[
                  "updated_at"
              ] = (
                  datetime
                  .now(
                      timezone.utc
                  )
                  .isoformat()
              )


              OUT.write_text(
                  json.dumps(
                      data,
                      indent=2,
                      sort_keys=True,
                  )
                  +
                  "\n"
              )


              print(
                  "closing-lines.json saved."
              )


          else:

              print(
                  "No changes."
              )


          print(
              "Added:",
              added
          )

          print(
              "Total stored:",
              len(games)
          )

          PY


      - name: Commit only if JSON changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- closing-lines.json)" ]; then
            echo "No JSON changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add closing-lines.json

          git commit -m "Update verified NFL pregame odds"

          git push
