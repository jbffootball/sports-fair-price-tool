
name: Update NFL Pregame Odds

on:
  workflow_dispatch:
  schedule:
    # Dates and kickoffs are discovered dynamically.
    - cron: '*/15 * * * *'
    # More frequent checks during typical NFL game windows.
    - cron: '*/5 14-23 * * 0'
    - cron: '*/5 0-6 * * 1'
    - cron: '*/5 22-23 * * 1,4'
    - cron: '*/5 0-6 * * 2,5'

permissions:
  contents: write

concurrency:
  group: nfl-closing-lines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture NFL moneyline checkpoints
        run: python scripts/capture_nfl_odds.py

      - name: Commit verified pregame snapshots
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- closing-lines.json)" ]; then
            echo "No additional verified snapshots"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add closing-lines.json
          git commit -m 'Update verified NFL pregame odds checkpoints'

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done

          exit 1

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-odds-diagnostics
          path: nfl-odds-diagnostics.json
          retention-days: 7
          if-no-files-found: ignore
