name: Update NFL Pregame Odds

on:
  workflow_dispatch:

  schedule:
    # Sunday daytime + Sunday night
    - cron: "*/5 12-23 * * 0"
    - cron: "*/5 0-6 * * 1"

    # Monday night
    - cron: "*/5 22-23 * * 1"
    - cron: "*/5 0-6 * * 2"

    # Thursday night
    - cron: "*/5 22-23 * * 4"
    - cron: "*/5 0-6 * * 5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture verified NFL pregame moneylines
        shell: bash
        run: |
          python - <<'PY'

          import json
          import re
          import subprocess
          import urllib.request

          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo


          OUT = Path("closing-lines.json")

          ESPN = (
              "https://site.api.espn.com/apis/site/v2/"
              "sports/football/nfl/scoreboard"
          )

          ACTION = (
              "https://api.actionnetwork.com/"
              "web/v1/scoreboard/nfl"
          )

          ET = ZoneInfo(
              "America/New_York"
          )


          # ----------------------------------------
          # SPORTSBOOK PRIORITY
          #
          # 68  = DraftKings
          # 75  = BetMGM
          # 123 = Caesars
          # 79  = bet365
          # 71  = BetRivers
          # ----------------------------------------

          BOOKS = {
              68: "DraftKings",
              75: "BetMGM",
              123: "Caesars",
              79: "bet365",
              71: "BetRivers",
          }

          BOOK_PRIORITY = [
              68,
              75,
              123,
              79,
              71,
          ]


          # ========================================
          # HTTP
          # ========================================

          def fetch_text(
              url
          ):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 "
                          "(iPhone; CPU iPhone OS 17_0 "
                          "like Mac OS X) "
                          "AppleWebKit/605.1.15",

                      "Accept":
                          "application/json,"
                          "text/plain,*/*",
                  },
              )


              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:

                  return (
                      response
                      .read()
                      .decode(
                          "utf-8",
                          errors="replace",
                      )
                  )


          def fetch_json(
              url
          ):

              text = fetch_text(
                  url
              )


              if not text.strip():

                  raise RuntimeError(
                      "Empty response from "
                      +
                      url
                  )


              try:

                  return json.loads(
                      text
                  )


              except Exception:

                  print(
                      "BAD JSON FROM:"
                  )

                  print(
                      url
                  )

                  print(
                      text[:500]
                  )

                  raise


          # ========================================
          # EXISTING JSON
          # ========================================

          def valid_json(
              text
          ):

              if (
                  not text
                  or
                  not text.strip()
              ):

                  return None


              try:

                  data = json.loads(
                      text
                  )

              except Exception:

                  return None


              if not isinstance(
                  data,
                  dict,
              ):

                  return None


              if not isinstance(
                  data.get(
                      "games",
                      {},
                  ),
                  dict,
              ):

                  return None


              return data


          def recover_existing():

              if OUT.exists():

                  current = valid_json(
                      OUT.read_text(
                          errors="replace"
                      )
                  )


                  if current is not None:

                      print(
                          "Existing closing-lines.json valid."
                      )

                      return current


              print(
                  "Current JSON invalid; "
                  "recovering from Git history."
              )


              result = subprocess.run(
                  [
                      "git",
                      "log",
                      "--format=%H",
                      "--",
                      "closing-lines.json",
                  ],
                  capture_output=True,
                  text=True,
              )


              for sha in result.stdout.splitlines():

                  sha = sha.strip()


                  if not sha:

                      continue


                  old = subprocess.run(
                      [
                          "git",
                          "show",
                          f"{sha}:closing-lines.json",
                      ],
                      capture_output=True,
                      text=True,
                  )


                  if old.returncode != 0:

                      continue


                  recovered = valid_json(
                      old.stdout
                  )


                  if (
                      recovered is not None
                      and
                      recovered.get(
                          "games"
                      )
                  ):

                      print(
                          "Recovered",
                          len(
                              recovered[
                                  "games"
                              ]
                          ),
                          "games."
                      )

                      return recovered


              return {
                  "updated_at": None,
                  "games": {},
              }


          # ========================================
          # TEAM MATCHING
          # ========================================

          def normalize_team(
              name
          ):

              name = (
                  str(
                      name
                      or
                      ""
                  )
                  .lower()
                  .replace(
                      "&",
                      "and"
                  )
              )


              name = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  name,
              )


              return " ".join(
                  name.split()
              )


          def nickname(
              name
          ):

              parts = normalize_team(
                  name
              ).split()


              if not parts:

                  return ""


              return parts[
                  -1
              ]


          def teams_match(
              a,
              b
          ):

              na = normalize_team(
                  a
              )

              nb = normalize_team(
                  b
              )


              if (
                  na
                  and
                  na == nb
              ):

                  return True


              # NFL nicknames are unique.
              return (
                  nickname(
                      a
                  )
                  ==
                  nickname(
                      b
                  )
                  and
                  nickname(
                      a
                  )
                  !=
                  ""
              )


          # ========================================
          # MONEYLINE MATH
          # ========================================

          def parse_moneyline(
              value
          ):

              if value is None:

                  return None


              try:

                  value = int(
                      value
                  )

              except Exception:

                  return None


              if value == 0:

                  return None


              return value


          def implied_probability(
              ml
          ):

              ml = int(
                  ml
              )


              if ml < 0:

                  return (
                      -ml
                      /
                      (
                          -ml
                          +
                          100
                      )
                  )


              return (
                  100
                  /
                  (
                      ml
                      +
                      100
                  )
              )


          def no_vig_pair(
              away_ml,
              home_ml,
          ):

              away_raw = implied_probability(
                  away_ml
              )

              home_raw = implied_probability(
                  home_ml
              )


              total = (
                  away_raw
                  +
                  home_raw
              )


              return (
                  away_raw
                  /
                  total,

                  home_raw
                  /
                  total,
              )


          # ========================================
          # ACTION NETWORK
          # ========================================

          def action_url(
              date_string
          ):

              book_ids = ",".join(
                  str(
                      x
                  )
                  for x
                  in BOOK_PRIORITY
              )


              return (
                  ACTION
                  +
                  "?bookIds="
                  +
                  book_ids
                  +
                  "&date="
                  +
                  date_string
                  +
                  "&periods=event"
              )


          def parse_action_games(
              payload
          ):

              parsed = []


              for game in payload.get(
                  "games",
                  [],
              ):

                  teams = {
                      team.get(
                          "id"
                      ):
                      team

                      for team
                      in game.get(
                          "teams",
                          [],
                      )
                  }


                  home = (
                      teams
                      .get(
                          game.get(
                              "home_team_id"
                          ),
                          {},
                      )
                      .get(
                          "full_name",
                          "",
                      )
                  )


                  away = (
                      teams
                      .get(
                          game.get(
                              "away_team_id"
                          ),
                          {},
                      )
                      .get(
                          "full_name",
                          "",
                      )
                  )


                  if (
                      not home
                      or
                      not away
                  ):

                      continue


                  rows = []


                  for row in game.get(
                      "odds",
                      [],
                  ):

                      # CRITICAL:
                      #
                      # "game" = full-game pregame row.
                      # It freezes at kickoff.
                      #
                      # "live" = in-game odds.
                      # We NEVER use those.

                      if row.get(
                          "type"
                      ) != "game":

                          continue


                      book_id = row.get(
                          "book_id"
                      )


                      if book_id not in BOOKS:

                          continue


                      line_status = (
                          row.get(
                              "line_status"
                          )
                          or
                          {}
                      )


                      if (
                          line_status.get(
                              "ml_home"
                          )
                          ==
                          2
                          or
                          line_status.get(
                              "ml_away"
                          )
                          ==
                          2
                      ):

                          continue


                      home_ml = parse_moneyline(
                          row.get(
                              "ml_home"
                          )
                      )


                      away_ml = parse_moneyline(
                          row.get(
                              "ml_away"
                          )
                      )


                      if (
                          home_ml is None
                          or
                          away_ml is None
                      ):

                          continue


                      rows.append(
                          {
                              "book_id":
                                  book_id,

                              "book":
                                  BOOKS[
                                      book_id
                                  ],

                              "home_ml":
                                  home_ml,

                              "away_ml":
                                  away_ml,

                              "inserted":
                                  row.get(
                                      "inserted"
                                  ),
                          }
                      )


                  parsed.append(
                      {
                          "action_id":
                              game.get(
                                  "id"
                              ),

                          "status":
                              game.get(
                                  "status"
                              ),

                          "start_time":
                              game.get(
                                  "start_time"
                              ),

                          "home":
                              home,

                          "away":
                              away,

                          "rows":
                              rows,
                      }
                  )


              return parsed


          def find_action_game(
              action_games,
              away_name,
              home_name,
          ):

              for game in action_games:

                  if (
                      teams_match(
                          game[
                              "away"
                          ],
                          away_name,
                      )
                      and
                      teams_match(
                          game[
                              "home"
                          ],
                          home_name,
                      )
                  ):

                      return game


              return None


          def choose_action_row(
              game
          ):

              rows = game.get(
                  "rows",
                  []
              )


              for preferred_id in BOOK_PRIORITY:

                  for row in rows:

                      if (
                          row.get(
                              "book_id"
                          )
                          ==
                          preferred_id
                      ):

                          return row


              return None


          # ========================================
          # ESPN FALLBACK
          # ========================================

          def parse_espn_moneyline(
              competition
          ):

              for odds in (
                  competition.get(
                      "odds"
                  )
                  or
                  []
              ):

                  away = (
                      odds.get(
                          "awayTeamOdds"
                      )
                      or
                      {}
                  )

                  home = (
                      odds.get(
                          "homeTeamOdds"
                      )
                      or
                      {}
                  )


                  away_ml = parse_moneyline(
                      away.get(
                          "moneyLine"
                      )
                      or
                      away.get(
                          "moneyline"
                      )
                  )


                  home_ml = parse_moneyline(
                      home.get(
                          "moneyLine"
                      )
                      or
                      home.get(
                          "moneyline"
                      )
                  )


                  if (
                      away_ml is not None
                      and
                      home_ml is not None
                  ):

                      return (
                          away_ml,
                          home_ml,
                      )


              return None


          # ========================================
          # LOAD DATA
          # ========================================

          data = recover_existing()


          games = data.setdefault(
              "games",
              {},
          )


          original_games = json.dumps(
              games,
              sort_keys=True,
          )


          now_utc = datetime.now(
              timezone.utc
          )


          today_et = datetime.now(
              ET
          ).strftime(
              "%Y%m%d"
          )


          # ----------------------------------------
          # ESPN SCHEDULE / EVENT IDS
          # ----------------------------------------

          espn = fetch_json(
              ESPN
              +
              "?limit=100&dates="
              +
              today_et
          )


          print(
              "ESPN events:",
              len(
                  espn.get(
                      "events",
                      [],
                  )
              ),
          )


          # ----------------------------------------
          # ACTION NETWORK PUBLIC JSON
          # ----------------------------------------

          action_feed_url = action_url(
              today_et
          )


          try:

              action_payload = fetch_json(
                  action_feed_url
              )


              action_games = parse_action_games(
                  action_payload
              )


              print(
                  "Action Network games:",
                  len(
                      action_games
                  ),
              )


          except Exception as exc:

              print(
                  "Action Network fetch failed:",
                  exc,
              )


              action_games = []


          changed = 0


          # ========================================
          # PROCESS ESPN EVENTS
          # ========================================

          for event in espn.get(
              "events",
              [],
          ):

              competitions = (
                  event.get(
                      "competitions"
                  )
                  or
                  []
              )


              if not competitions:

                  continue


              competition = competitions[
                  0
              ]


              game_id = str(
                  event.get(
                      "id"
                  )
              )


              competitors = competition.get(
                  "competitors",
                  [],
              )


              away = next(
                  (
                      team
                      for team
                      in competitors
                      if team.get(
                          "homeAway"
                      )
                      ==
                      "away"
                  ),
                  None,
              )


              home = next(
                  (
                      team
                      for team
                      in competitors
                      if team.get(
                          "homeAway"
                      )
                      ==
                      "home"
                  ),
                  None,
              )


              if (
                  not away
                  or
                  not home
              ):

                  continue


              away_name = (
                  away
                  .get(
                      "team",
                      {},
                  )
                  .get(
                      "displayName"
                  )
              )


              home_name = (
                  home
                  .get(
                      "team",
                      {},
                  )
                  .get(
                      "displayName"
                  )
              )


              if (
                  not away_name
                  or
                  not home_name
              ):

                  continue


              existing = games.get(
                  game_id
              )


              # Existing verified record stays forever.

              if existing:

                  print(
                      "Preserving:",
                      game_id,
                      away_name,
                      "at",
                      home_name,
                  )

                  continue


              print()

              print(
                  "LOOKING UP:",
                  game_id,
                  away_name,
                  "at",
                  home_name,
              )


              away_ml = None

              home_ml = None

              source = None

              source_url = None

              odds_timestamp = None


              # ====================================
              # 1. ACTION NETWORK FROZEN PREGAME ROW
              # ====================================

              action_game = find_action_game(
                  action_games,
                  away_name,
                  home_name,
              )


              if action_game:

                  row = choose_action_row(
                      action_game
                  )


                  if row:

                      away_ml = row[
                          "away_ml"
                      ]

                      home_ml = row[
                          "home_ml"
                      ]

                      source = (
                          "Action Network "
                          +
                          row[
                              "book"
                          ]
                          +
                          " frozen pregame moneyline"
                      )

                      source_url = (
                          action_feed_url
                      )

                      odds_timestamp = (
                          row.get(
                              "inserted"
                          )
                      )


                      print(
                          "ACTION FOUND:",
                          row[
                              "book"
                          ],
                          away_ml,
                          "/",
                          home_ml,
                          "| timestamp:",
                          odds_timestamp,
                      )


              # ====================================
              # 2. ESPN FALLBACK
              # ====================================

              if (
                  away_ml is None
                  or
                  home_ml is None
              ):

                  espn_odds = (
                      parse_espn_moneyline(
                          competition
                      )
                  )


                  if espn_odds:

                      away_ml = (
                          espn_odds[
                              0
                          ]
                      )

                      home_ml = (
                          espn_odds[
                              1
                          ]
                      )

                      source = (
                          "ESPN pregame moneyline"
                      )

                      source_url = (
                          ESPN
                      )


                      print(
                          "ESPN FOUND:",
                          away_ml,
                          "/",
                          home_ml,
                      )


              # ====================================
              # NOTHING VERIFIED
              # ====================================

              if (
                  away_ml is None
                  or
                  home_ml is None
              ):

                  print(
                      "PREGAME_ODDS_UNAVAILABLE"
                  )

                  continue


              # ====================================
              # FAIR NO-VIG PROBABILITY
              # ====================================

              away_prob, home_prob = (
                  no_vig_pair(
                      away_ml,
                      home_ml,
                  )
              )


              if (
                  home_prob
                  >=
                  away_prob
              ):

                  favorite = (
                      home_name
                  )

                  favorite_probability = (
                      home_prob
                  )

              else:

                  favorite = (
                      away_name
                  )

                  favorite_probability = (
                      away_prob
                  )


              kickoff = datetime.fromisoformat(
                  event[
                      "date"
                  ]
                  .replace(
                      "Z",
                      "+00:00",
                  )
              )


              games[
                  game_id
              ] = {

                  "event_id":
                      game_id,

                  "date":
                      kickoff
                      .astimezone(
                          ET
                      )
                      .strftime(
                          "%Y-%m-%d"
                      ),

                  "away":
                      away_name,

                  "home":
                      home_name,

                  "away_ml":
                      away_ml,

                  "home_ml":
                      home_ml,

                  "away_fair_probability":
                      round(
                          away_prob,
                          6,
                      ),

                  "home_fair_probability":
                      round(
                          home_prob,
                          6,
                      ),

                  "pregame_favorite":
                      favorite,

                  "favorite_probability":
                      round(
                          favorite_probability,
                          6,
                      ),

                  "source":
                      source,

                  "source_url":
                      source_url,

                  "odds_timestamp":
                      odds_timestamp,

                  "captured_at":
                      now_utc.isoformat(),
              }


              changed += 1


              print(
                  "SAVED:",
                  game_id,
                  away_name,
                  away_ml,
                  "/",
                  home_name,
                  home_ml,
              )


              print(
                  "Favorite:",
                  favorite,
                  round(
                      favorite_probability
                      *
                      100,
                      1,
                  ),
                  "%"
              )


          # ========================================
          # SAVE FILE
          # ========================================

          new_games = json.dumps(
              games,
              sort_keys=True,
          )


          if (
              new_games
              !=
              original_games
          ):

              data[
                  "updated_at"
              ] = (
                  now_utc.isoformat()
              )


              OUT.write_text(
                  json.dumps(
                      data,
                      indent=2,
                      sort_keys=True,
                  )
                  +
                  "\n"
              )


              print()

              print(
                  "closing-lines.json updated."
              )


          else:

              print()

              print(
                  "No JSON changes."
              )


          print(
              "Records added:",
              changed,
          )


          print(
              "Total stored:",
              len(
                  games
              ),
          )

          PY


      - name: Commit only if JSON changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- closing-lines.json)" ]; then
            echo "No JSON changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add closing-lines.json

          git commit -m "Capture verified NFL pregame moneylines"

          git push
