name: Update NFL Pregame Odds

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 12-23 * * 0'
    - cron: '*/5 0-6 * * 1'
    - cron: '*/5 22-23 * * 1'
    - cron: '*/5 0-6 * * 2'
    - cron: '*/5 22-23 * * 4'
    - cron: '*/5 0-6 * * 5'

permissions:
  contents: write

concurrency:
  group: nfl-closing-lines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture verified NFL pregame moneylines
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          OUT = Path('closing-lines.json')
          REPORT = Path('nfl-odds-diagnostics.json')
          SCOREBOARD = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'
          CORE = 'https://sports.core.api.espn.com/v2/sports/football/leagues/nfl'
          ET = ZoneInfo('America/New_York')
          NOW = datetime.now(timezone.utc)
          errors, missing = [], []
          added = requests = successful_requests = 0

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json',
                  'Referer': 'https://www.espn.com/'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=25) as response:
                          return json.load(response)
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError):
                      if attempt == 2:
                          raise
                      time.sleep(attempt + 1)

          def ml(value):
              if isinstance(value, dict):
                  value = value.get('american', value.get('value', value.get('displayValue')))
              if isinstance(value, str):
                  value = value.strip().replace(',', '').upper()
                  if value in ('EVEN', 'EVENS', 'EV'):
                      return 100
                  value = value.replace('+', '')
              try:
                  n = int(value)
                  return n if 100 <= abs(n) <= 100000 else None
              except (ValueError, TypeError):
                  return None

          def implied(value):
              return -value / (100 - value) if value < 0 else 100 / (100 + value)

          def names(competition):
              teams = {x.get('homeAway'): (x.get('team') or {}).get('displayName')
                       for x in competition.get('competitors', [])}
              if not teams.get('away') or not teams.get('home'):
                  raise ValueError('Missing home or away team')
              return teams['away'], teams['home']

          def find_line(items, kickoff):
              # Current prices are eligible ONLY before kickoff.
              # Once started, accept only explicitly labeled closing snapshots.
              snapshots = ('current', 'top') if NOW < kickoff else ('close',)
              candidates = []
              for row in items:
                  if not isinstance(row, dict):
                      continue
                  provider = row.get('provider') or {}
                  provider_name = str(provider.get('name') or 'Unknown provider')
                  try:
                      priority = int(provider.get('priority', 999))
                  except (ValueError, TypeError):
                      priority = 999
                  for order, snap in enumerate(snapshots):
                      a = row.get('awayTeamOdds') or {}
                      h = row.get('homeTeamOdds') or {}
                      if snap != 'top':
                          a = a.get(snap) or {}
                          h = h.get(snap) or {}
                      away_ml = ml(a.get('moneyLine'))
                      home_ml = ml(h.get('moneyLine'))
                      if away_ml is not None and home_ml is not None:
                          candidates.append((order, priority, provider_name, away_ml, home_ml, snap))
              if not candidates:
                  return None
              candidates.sort()
              _, _, provider, away_ml, home_ml, snap = candidates[0]
              return away_ml, home_ml, f'ESPN Core {provider} {snap} moneyline', snap

          if not OUT.exists():
              raise RuntimeError('closing-lines.json missing; refusing to overwrite historical data')
          data = json.loads(OUT.read_text())
          if not isinstance(data, dict) or not isinstance(data.get('games'), dict):
              raise RuntimeError('closing-lines.json malformed; refusing to overwrite')
          games = data['games']
          original_count = len(games)
          today = NOW.astimezone(ET).date()

          for date in (today - timedelta(days=1), today, today + timedelta(days=1)):
              day = date.strftime('%Y%m%d')
              try:
                  scoreboard = fetch(f'{SCOREBOARD}?dates={day}&limit=100')
              except Exception as exc:
                  errors.append(f'SCOREBOARD {day}: {exc}')
                  print('ERROR_SCOREBOARD', day, str(exc))
                  continue
              events = scoreboard.get('events') or []
              print('DAY', day, 'events', len(events))
              for event in events:
                  event_id = str(event.get('id') or '')
                  if not event_id or event_id in games:
                      continue
                  competition = (event.get('competitions') or [{}])[0]
                  competition_id = str(competition.get('id') or event_id)
                  try:
                      away, home = names(competition)
                      kickoff = datetime.fromisoformat(event['date'].replace('Z', '+00:00'))
                  except (KeyError, ValueError, TypeError) as exc:
                      missing.append({'id': event_id, 'reason': f'Bad game metadata: {exc}'})
                      continue
                  requests += 1
                  url = f'{CORE}/events/{event_id}/competitions/{competition_id}/odds?lang=en&region=us&limit=100'
                  try:
                      payload = fetch(url)
                      successful_requests += 1
                      line = find_line(payload.get('items') or [], kickoff)
                  except Exception as exc:
                      errors.append(f'ODDS {event_id}: {exc}')
                      line = None
                  if not line:
                      missing.append({'id': event_id, 'away': away, 'home': home,
                                      'reason': 'No verified pregame moneyline pair'})
                      print('MISSING', event_id, away, '@', home)
                      continue
                  away_ml, home_ml, source, snapshot = line
                  ap, hp = implied(away_ml), implied(home_ml)
                  fair_away, fair_home = ap / (ap + hp), hp / (ap + hp)
                  captured = datetime.now(timezone.utc).isoformat()
                  games[event_id] = {
                      'event_id': event_id,
                      'date': kickoff.astimezone(ET).date().isoformat(),
                      'away': away, 'home': home,
                      'away_ml': away_ml, 'home_ml': home_ml,
                      'away_fair_probability': round(fair_away, 6),
                      'home_fair_probability': round(fair_home, 6),
                      'pregame_favorite': away if fair_away > fair_home else home,
                      'favorite_probability': round(max(fair_away, fair_home), 6),
                      'source': source, 'source_url': url,
                      'odds_timestamp': captured if snapshot != 'close' else None,
                      'captured_at': captured
                  }
                  added += 1
                  print('SAVED', event_id, away, away_ml, home, home_ml, source)

          if added:
              data['updated_at'] = datetime.now(timezone.utc).isoformat()
              OUT.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          REPORT.write_text(json.dumps({
              'checked_at': NOW.isoformat(), 'existing_records': original_count,
              'added_records': added, 'total_records': len(games),
              'odds_requests': requests, 'successful_odds_requests': successful_requests,
              'missing_games': missing, 'source_errors': errors
          }, indent=2) + '\n')
          print('SUMMARY', 'existing', original_count, 'added', added,
                'total', len(games), 'requests', requests,
                'successful_requests', successful_requests,
                'missing', len(missing), 'errors', len(errors))
          if missing:
              print(f'::warning::{len(missing)} NFL games still lack verified odds')
          if requests and not successful_requests:
              raise RuntimeError('All ESPN Core odds requests failed; see diagnostic artifact')
          PY

      - name: Commit new NFL odds only
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- closing-lines.json)" ]; then
            echo 'No new verified NFL odds to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add closing-lines.json
          git commit -m 'Capture verified ESPN NFL pregame moneylines'
          git push

      - name: Upload NFL odds diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-odds-diagnostics
          path: nfl-odds-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
