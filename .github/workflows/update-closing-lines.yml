name: Update NFL Closing Lines

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 13-23 * * 0"
    - cron: "*/5 22-23 * * 1,4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh frozen NFL closing lines
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ESPN = (
              "https://site.api.espn.com/apis/site/v2/"
              "sports/football/nfl/scoreboard"
          )

          JINA_ODDS_GAP = (
              "https://r.jina.ai/"
              "https://theoddsgap.com/weeklyslate/nfl"
          )

          JINA_STATMUSE = (
              "https://r.jina.ai/"
              "https://www.statmuse.com/nfl/ask/nfl-moneylines"
          )

          OUT = Path("closing-lines.json")


          def fetch_text(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 FootballFairPriceLookup/1.0"
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30,
              ) as response:

                  return response.read().decode(
                      "utf-8",
                      errors="replace",
                  )


          def fetch_json(url):
              return json.loads(
                  fetch_text(url)
              )


          def clean(text):
              return (
                  text
                  .replace("−", "-")
                  .replace("–", "-")
                  .replace("—", "-")
              )


          def normalize_team(name):
              return (
                  name.lower()
                  .replace("&", "and")
                  .replace(".", "")
                  .replace("'", "")
                  .replace("-", " ")
                  .replace("  ", " ")
                  .strip()
              )


          def team_aliases(name):
              n = normalize_team(name)

              aliases = {
                  "san francisco 49ers": [
                      "san francisco 49ers",
                      "san francisco",
                  ],
                  "los angeles rams": [
                      "los angeles rams",
                      "la rams",
                  ],
                  "las vegas raiders": [
                      "las vegas raiders",
                      "raiders",
                  ],
                  "green bay packers": [
                      "green bay packers",
                      "green bay",
                  ],
                  "detroit lions": [
                      "detroit lions",
                      "detroit",
                  ],
              }

              return aliases.get(
                  n,
                  [n],
              )


          def matchup_matches(
              row_away,
              row_home,
              away_name,
              home_name,
          ):

              row_away = normalize_team(
                  row_away
              )

              row_home = normalize_team(
                  row_home
              )

              away_aliases = team_aliases(
                  away_name
              )

              home_aliases = team_aliases(
                  home_name
              )

              return (
                  any(
                      alias == row_away
                      for alias in away_aliases
                  )
                  and
                  any(
                      alias == row_home
                      for alias in home_aliases
                  )
              )


          def parse_odds_gap(
              text,
              away_name,
              home_name,
          ):

              text = clean(
                  text
              )


              escaped_away = re.escape(
                  away_name
              )

              escaped_home = re.escape(
                  home_name
              )


              heading = re.search(
                  rf"^###\s+"
                  rf"(?:\[\d+†)?"
                  rf"{escaped_away}"
                  rf"\s+at\s+"
                  rf"{escaped_home}"
                  rf"(?:\])?"
                  rf"\s*$",
                  text,
                  flags=re.I | re.M,
              )


              if not heading:
                  return None


              after = text[
                  heading.start():
              ]


              next_heading = re.search(
                  r"\n###\s+",
                  after[
                      len(
                          heading.group(0)
                      ):
                  ],
              )


              if next_heading:

                  end = (
                      len(
                          heading.group(0)
                      )
                      +
                      next_heading.start()
                  )

                  segment = after[:end]

              else:

                  segment = after


              if not re.search(
                  r"Moneyline\s+at\s+Close|"
                  r"at\s+Close,\s+Best\s+to\s+Worst",
                  segment,
                  flags=re.I,
              ):

                  return None


              def team_close(team_name):

                  escaped = re.escape(
                      team_name
                  )


                  header = re.search(
                      rf"####\s+"
                      rf"(?:\[\d+†)?"
                      rf"{escaped}"
                      rf"(?:\])?"
                      rf"\s+"
                      rf"(?:Moneyline\s+at\s+Close|"
                      rf"at\s+Close,\s+Best\s+to\s+Worst)",
                      segment,
                      flags=re.I,
                  )


                  if not header:
                      return None


                  block = segment[
                      header.end():
                  ]


                  next_section = re.search(
                      r"\n####\s+",
                      block,
                  )


                  if next_section:
                      block = block[
                          :next_section.start()
                      ]


                  match = re.search(
                      r"(?:\|\s*)?"
                      r"Novig"
                      r"\s*(?:\|\s*|\s+)"
                      r"([+-]\d+)",
                      block,
                      flags=re.I,
                  )


                  if not match:
                      return None


                  return int(
                      match.group(1)
                  )


              away_ml = team_close(
                  away_name
              )

              home_ml = team_close(
                  home_name
              )


              if (
                  away_ml is None
                  or
                  home_ml is None
              ):

                  return None


              return (
                  away_ml,
                  home_ml,
              )


          def parse_statmuse(
              text,
              away_name,
              home_name,
          ):

              text = clean(
                  text
              )


              #
              # Safety requirement:
              # only use StatMuse if the page explicitly
              # says "Consensus closing odds".
              #

              if not re.search(
                  r"Consensus closing odds",
                  text,
                  flags=re.I,
              ):

                  return None


              #
              # Jina renders StatMuse rows roughly as:
              #
              # | Los Angeles Rams | -178 | @ |
              #   Las Vegas Raiders | +149 |
              #
              # Match the row generically, then confirm
              # both team names correspond to ESPN's matchup.
              #

              row_pattern = re.compile(
                  r"\|\s*"
                  r"([^|\n]+?)"
                  r"\s*\|\s*"
                  r"([+-]\d+)"
                  r"\s*\|\s*@\s*\|\s*"
                  r"([^|\n]+?)"
                  r"\s*\|\s*"
                  r"([+-]\d+)"
                  r"\s*\|",
                  flags=re.I,
              )


              for match in row_pattern.finditer(
                  text
              ):

                  row_away = match.group(
                      1
                  ).strip()

                  away_ml = int(
                      match.group(
                          2
                      )
                  )

                  row_home = match.group(
                      3
                  ).strip()

                  home_ml = int(
                      match.group(
                          4
                      )
                  )


                  if matchup_matches(
                      row_away,
                      row_home,
                      away_name,
                      home_name,
                  ):

                      return (
                          away_ml,
                          home_ml,
                      )


              return None


          if OUT.exists():

              try:

                  data = json.loads(
                      OUT.read_text()
                  )

              except Exception:

                  data = {
                      "updated_at": None,
                      "games": {},
                  }

          else:

              data = {
                  "updated_at": None,
                  "games": {},
              }


          games = data.setdefault(
              "games",
              {},
          )


          now_et = datetime.now(
              ZoneInfo(
                  "America/New_York"
              )
          )


          date_query = now_et.strftime(
              "%Y%m%d"
          )


          scoreboard = fetch_json(
              f"{ESPN}"
              f"?limit=100"
              f"&dates={date_query}"
          )


          try:

              odds_gap_text = fetch_text(
                  JINA_ODDS_GAP
              )

              print(
                  "Odds Gap weekly board loaded."
              )

          except Exception as exc:

              odds_gap_text = ""

              print(
                  "Odds Gap fetch failed:",
                  exc,
              )


          try:

              statmuse_text = fetch_text(
                  JINA_STATMUSE
              )

              print(
                  "StatMuse closing-odds page loaded."
              )

          except Exception as exc:

              statmuse_text = ""

              print(
                  "StatMuse fetch failed:",
                  exc,
              )


          added = 0


          for event in scoreboard.get(
              "events",
              [],
          ):

              competitions = (
                  event.get(
                      "competitions"
                  )
                  or
                  []
              )


              if not competitions:
                  continue


              competition = competitions[
                  0
              ]


              state = (
                  competition
                  .get(
                      "status",
                      {},
                  )
                  .get(
                      "type",
                      {},
                  )
                  .get(
                      "state"
                  )
              )


              #
              # Critical:
              # never save a line before kickoff.
              #

              if state not in (
                  "in",
                  "post",
              ):

                  continue


              game_id = str(
                  event.get(
                      "id"
                  )
              )


              existing = games.get(
                  game_id,
                  {},
              )


              #
              # Once stored, never overwrite.
              #

              if (
                  existing.get(
                      "away_ml"
                  )
                  is not None
                  and
                  existing.get(
                      "home_ml"
                  )
                  is not None
              ):

                  continue


              competitors = (
                  competition.get(
                      "competitors",
                      [],
                  )
              )


              away = next(
                  (
                      team
                      for team
                      in competitors
                      if team.get(
                          "homeAway"
                      )
                      ==
                      "away"
                  ),
                  None,
              )


              home = next(
                  (
                      team
                      for team
                      in competitors
                      if team.get(
                          "homeAway"
                      )
                      ==
                      "home"
                  ),
                  None,
              )


              if (
                  not away
                  or
                  not home
              ):

                  continue


              away_name = (
                  away
                  .get(
                      "team",
                      {},
                  )
                  .get(
                      "displayName"
                  )
              )


              home_name = (
                  home
                  .get(
                      "team",
                      {},
                  )
                  .get(
                      "displayName"
                  )
              )


              if (
                  not away_name
                  or
                  not home_name
              ):

                  continue


              print()
              print(
                  "Checking:",
                  away_name,
                  "at",
                  home_name,
              )


              closing = None
              source_used = None


              #
              # PRIMARY:
              # Odds Gap explicit Novig close.
              #

              if odds_gap_text:

                  closing = parse_odds_gap(
                      odds_gap_text,
                      away_name,
                      home_name,
                  )


                  if closing:

                      source_used = (
                          "Odds Gap Novig close"
                      )

                      print(
                          "Found on Odds Gap."
                      )


              #
              # FALLBACK:
              # StatMuse consensus closing odds.
              #

              if (
                  closing is None
                  and
                  statmuse_text
              ):

                  closing = parse_statmuse(
                      statmuse_text,
                      away_name,
                      home_name,
                  )


                  if closing:

                      source_used = (
                          "StatMuse consensus closing odds"
                      )

                      print(
                          "Found on StatMuse."
                      )


              if closing is None:

                  print(
                      "No verified closing line found."
                  )

                  continue


              away_ml, home_ml = (
                  closing
              )


              games[
                  game_id
              ] = {

                  "event_id":
                      game_id,

                  "away":
                      away_name,

                  "home":
                      home_name,

                  "away_ml":
                      away_ml,

                  "home_ml":
                      home_ml,

                  "source":
                      source_used,

              }


              added += 1


              print(
                  "Saved:",
                  away_ml,
                  home_ml,
                  "from",
                  source_used,
              )


          if added:

              data[
                  "updated_at"
              ] = (
                  datetime
                  .now(
                      timezone.utc
                  )
                  .isoformat()
              )


          OUT.write_text(
              json.dumps(
                  data,
                  indent=2,
                  sort_keys=True,
              )
              +
              "\n"
          )


          print()
          print(
              "New closing lines:",
              added,
          )


          print(
              "Total stored games:",
              len(
                  games
              ),
          )

          PY


      - name: Commit updated JSON
        shell: bash
        run: |

          if [ -z "$(git status --porcelain -- closing-lines.json)" ]; then

            echo "No closing-line changes."

            exit 0

          fi


          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add closing-lines.json

          git commit -m "Update NFL closing lines"

          git push
