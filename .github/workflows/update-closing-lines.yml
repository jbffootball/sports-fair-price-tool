name: Update NFL Pregame Odds

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 13-23 * * 0"
    - cron: "*/5 22-23 * * 1,4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture verified NFL pregame odds
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          import urllib.request
          import urllib.parse

          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo


          OUT = Path("closing-lines.json")

          ESPN = (
              "https://site.api.espn.com/apis/site/v2/"
              "sports/football/nfl/scoreboard"
          )

          JINA = "https://r.jina.ai/http://"

          SEARCH = (
              "https://html.duckduckgo.com/html/?q="
          )


          def fetch_text(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "*/*",
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30,
              ) as r:
                  return r.read().decode(
                      "utf-8",
                      errors="replace",
                  )


          def fetch_json(url):
              text = fetch_text(url)

              if not text.strip():
                  raise RuntimeError(
                      "Empty response from "
                      + url
                  )

              return json.loads(text)


          def valid_json(text):
              try:
                  data = json.loads(text)
              except Exception:
                  return None

              if not isinstance(data, dict):
                  return None

              if not isinstance(
                  data.get("games", {}),
                  dict,
              ):
                  return None

              return data


          def recover_existing():
              if OUT.exists():
                  current = valid_json(
                      OUT.read_text(
                          errors="replace"
                      )
                  )

                  if current:
                      return current

              result = subprocess.run(
                  [
                      "git",
                      "log",
                      "--format=%H",
                      "--",
                      "closing-lines.json",
                  ],
                  capture_output=True,
                  text=True,
              )

              for sha in result.stdout.splitlines():
                  sha = sha.strip()

                  if not sha:
                      continue

                  show = subprocess.run(
                      [
                          "git",
                          "show",
                          f"{sha}:closing-lines.json",
                      ],
                      capture_output=True,
                      text=True,
                  )

                  if show.returncode != 0:
                      continue

                  recovered = valid_json(
                      show.stdout
                  )

                  if (
                      recovered
                      and
                      recovered.get("games")
                  ):
                      return recovered

              return {
                  "updated_at": None,
                  "games": {},
              }


          def implied(ml):
              ml = int(ml)

              if ml < 0:
                  return (
                      -ml
                      /
                      (
                          -ml + 100
                      )
                  )

              return (
                  100
                  /
                  (
                      ml + 100
                  )
              )


          def no_vig(
              away_ml,
              home_ml,
          ):
              a = implied(
                  away_ml
              )

              h = implied(
                  home_ml
              )

              total = a + h

              return (
                  a / total,
                  h / total,
              )


          def extract_espn_odds(
              competition
          ):
              for item in (
                  competition.get("odds")
                  or
                  []
              ):
                  away = (
                      item.get("awayTeamOdds")
                      or
                      {}
                  )

                  home = (
                      item.get("homeTeamOdds")
                      or
                      {}
                  )

                  away_ml = (
                      away.get("moneyLine")
                      or
                      away.get("moneyline")
                  )

                  home_ml = (
                      home.get("moneyLine")
                      or
                      home.get("moneyline")
                  )

                  try:
                      away_ml = int(
                          away_ml
                      )

                      home_ml = int(
                          home_ml
                      )
                  except Exception:
                      continue

                  if (
                      away_ml
                      and
                      home_ml
                  ):
                      return (
                          away_ml,
                          home_ml,
                      )

              return None


          def search_urls(
              query,
              domain,
          ):
              try:
                  html = fetch_text(
                      SEARCH
                      +
                      urllib.parse.quote(
                          query
                      )
                  )
              except Exception:
                  return []

              urls = []

              for encoded in re.findall(
                  r'uddg=([^"&]+)',
                  html,
              ):
                  u = urllib.parse.unquote(
                      encoded
                  )

                  if (
                      domain in u
                      and
                      u not in urls
                  ):
                      urls.append(u)

              return urls[:6]


          def team_nick(name):
              return name.split()[-1]


          def parse_action_page(
              text,
              away_name,
              home_name,
          ):
              text = (
                  text
                  .replace("−", "-")
                  .replace("–", "-")
                  .replace("—", "-")
              )

              away = team_nick(
                  away_name
              )

              home = team_nick(
                  home_name
              )

              if not re.search(
                  r"Moneyline",
                  text,
                  flags=re.I,
              ):
                  return None

              def find_team_ml(team):
                  patterns = [
                      rf"{re.escape(team)}"
                      rf"[^\n]{{0,160}}"
                      rf"\|\s*([+-]\d{{3,4}})\s*$",

                      rf"{re.escape(team)}"
                      rf"[^\n]{{0,160}}"
                      rf"Moneyline"
                      rf"[^\n]{{0,80}}"
                      rf"([+-]\d{{3,4}})",
                  ]

                  for p in patterns:
                      m = re.search(
                          p,
                          text,
                          flags=re.I | re.M,
                      )

                      if m:
                          return int(
                              m.group(1)
                          )

                  return None

              away_ml = find_team_ml(
                  away
              )

              home_ml = find_team_ml(
                  home
              )

              if (
                  away_ml is None
                  or
                  home_ml is None
              ):
                  return None

              return (
                  away_ml,
                  home_ml,
              )


          def action_lookup(
              away_name,
              home_name,
              game_date,
          ):
              query = (
                  'site:actionnetwork.com/nfl-game '
                  f'"{away_name}" '
                  f'"{home_name}" '
                  f'"{game_date}"'
              )

              urls = search_urls(
                  query,
                  "actionnetwork.com/nfl-game",
              )

              for u in urls:
                  clean_url = (
                      u.split("?")[0]
                  )

                  reader = (
                      JINA
                      +
                      clean_url.replace(
                          "https://",
                          ""
                      )
                  )

                  try:
                      text = fetch_text(
                          reader
                      )
                  except Exception:
                      continue

                  result = parse_action_page(
                      text,
                      away_name,
                      home_name,
                  )

                  if result:
                      return (
                          result[0],
                          result[1],
                          clean_url,
                      )

              return None


          def parse_covers_page(
              text,
              away_name,
              home_name,
          ):
              text = (
                  text
                  .replace("−", "-")
                  .replace("–", "-")
                  .replace("—", "-")
              )

              away = team_nick(
                  away_name
              )

              home = team_nick(
                  home_name
              )

              def find_ml(team):
                  m = re.search(
                      rf"{re.escape(team)}"
                      rf"[^\n]{{0,120}}"
                      rf"([+-]\d{{3,4}})",
                      text,
                      flags=re.I,
                  )

                  if m:
                      return int(
                          m.group(1)
                      )

                  return None

              away_ml = find_ml(
                  away
              )

              home_ml = find_ml(
                  home
              )

              if (
                  away_ml is None
                  or
                  home_ml is None
              ):
                  return None

              return (
                  away_ml,
                  home_ml,
              )


          def covers_lookup(
              away_name,
              home_name,
              game_date,
          ):
              query = (
                  'site:covers.com/sport/football/nfl/matchup '
                  f'"{away_name}" '
                  f'"{home_name}" '
                  f'"{game_date}"'
              )

              urls = search_urls(
                  query,
                  "covers.com/sport/football/nfl/matchup",
              )

              for u in urls:
                  clean_url = (
                      u.split("?")[0]
                  )

                  reader = (
                      JINA
                      +
                      clean_url.replace(
                          "https://",
                          ""
                      )
                  )

                  try:
                      text = fetch_text(
                          reader
                      )
                  except Exception:
                      continue

                  result = parse_covers_page(
                      text,
                      away_name,
                      home_name,
                  )

                  if result:
                      return (
                          result[0],
                          result[1],
                          clean_url,
                      )

              return None


          data = recover_existing()

          games = data.setdefault(
              "games",
              {},
          )

          original = json.dumps(
              games,
              sort_keys=True,
          )


          now_et = datetime.now(
              ZoneInfo(
                  "America/New_York"
              )
          )

          today = now_et.strftime(
              "%Y%m%d"
          )

          scoreboard = fetch_json(
              ESPN
              +
              "?limit=100&dates="
              +
              today
          )


          now_utc = datetime.now(
              timezone.utc
          )


          added = 0


          for event in scoreboard.get(
              "events",
              [],
          ):
              comps = (
                  event.get(
                      "competitions"
                  )
                  or
                  []
              )

              if not comps:
                  continue

              competition = comps[0]

              game_id = str(
                  event.get("id")
              )

              if game_id in games:
                  continue

              kickoff = datetime.fromisoformat(
                  event["date"].replace(
                      "Z",
                      "+00:00",
                  )
              )

              minutes_to_kickoff = (
                  kickoff
                  -
                  now_utc
              ).total_seconds() / 60


              #
              # Capture only from 30 minutes
              # before kickoff through kickoff.
              #

              if (
                  minutes_to_kickoff > 30
                  or
                  minutes_to_kickoff < -2
              ):
                  continue


              competitors = (
                  competition.get(
                      "competitors",
                      []
                  )
              )

              away = next(
                  (
                      c
                      for c in competitors
                      if c.get("homeAway")
                      ==
                      "away"
                  ),
                  None,
              )

              home = next(
                  (
                      c
                      for c in competitors
                      if c.get("homeAway")
                      ==
                      "home"
                  ),
                  None,
              )

              if not away or not home:
                  continue

              away_name = (
                  away.get(
                      "team",
                      {}
                  ).get(
                      "displayName"
                  )
              )

              home_name = (
                  home.get(
                      "team",
                      {}
                  ).get(
                      "displayName"
                  )
              )

              print()
              print(
                  "CAPTURE WINDOW:",
                  away_name,
                  "at",
                  home_name,
                  round(
                      minutes_to_kickoff,
                      1
                  ),
                  "minutes to kickoff",
              )


              result = None
              source = None
              source_url = None


              #
              # 1. ESPN
              #

              result = extract_espn_odds(
                  competition
              )

              if result:
                  source = (
                      "ESPN pregame moneyline"
                  )

                  source_url = (
                      "ESPN scoreboard"
                  )


              #
              # 2. Action Network
              #

              if result is None:
                  game_date = kickoff.astimezone(
                      ZoneInfo(
                          "America/New_York"
                      )
                  ).strftime(
                      "%B %d %Y"
                  )

                  action = action_lookup(
                      away_name,
                      home_name,
                      game_date,
                  )

                  if action:
                      result = (
                          action[0],
                          action[1],
                      )

                      source = (
                          "Action Network pregame moneyline"
                      )

                      source_url = (
                          action[2]
                      )


              #
              # 3. Covers
              #

              if result is None:
                  game_date = kickoff.astimezone(
                      ZoneInfo(
                          "America/New_York"
                      )
                  ).strftime(
                      "%B %d %Y"
                  )

                  covers = covers_lookup(
                      away_name,
                      home_name,
                      game_date,
                  )

                  if covers:
                      result = (
                          covers[0],
                          covers[1],
                      )

                      source = (
                          "Covers pregame moneyline"
                      )

                      source_url = (
                          covers[2]
                      )


              if result is None:
                  print(
                      "PREGAME_ODDS_UNAVAILABLE"
                  )
                  continue


              away_ml, home_ml = result

              away_prob, home_prob = (
                  no_vig(
                      away_ml,
                      home_ml,
                  )
              )


              if home_prob >= away_prob:
                  favorite = (
                      home_name
                  )

                  favorite_prob = (
                      home_prob
                  )

              else:
                  favorite = (
                      away_name
                  )

                  favorite_prob = (
                      away_prob
                  )


              games[
                  game_id
              ] = {
                  "event_id":
                      game_id,

                  "away":
                      away_name,

                  "home":
                      home_name,

                  "away_ml":
                      away_ml,

                  "home_ml":
                      home_ml,

                  "away_fair_probability":
                      round(
                          away_prob,
                          6,
                      ),

                  "home_fair_probability":
                      round(
                          home_prob,
                          6,
                      ),

                  "pregame_favorite":
                      favorite,

                  "favorite_probability":
                      round(
                          favorite_prob,
                          6,
                      ),

                  "source":
                      source,

                  "source_url":
                      source_url,

                  "captured_before_kickoff":
                      round(
                          minutes_to_kickoff,
                          1,
                      ),

                  "captured_at":
                      now_utc.isoformat(),
              }


              added += 1


              print(
                  "SAVED:",
                  away_ml,
                  home_ml,
                  source,
              )


          new = json.dumps(
              games,
              sort_keys=True,
          )


          if new != original:
              data[
                  "updated_at"
              ] = (
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              )

              OUT.write_text(
                  json.dumps(
                      data,
                      indent=2,
                      sort_keys=True,
                  )
                  +
                  "\n"
              )

              print(
                  "Saved",
                  added,
                  "new pregame line(s)."
              )

          else:
              print(
                  "No new lines captured."
              )

          PY


      - name: Commit only if JSON changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- closing-lines.json)" ]; then
            echo "No JSON changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add closing-lines.json

          git commit -m "Capture NFL pregame odds"

          git push
