name: Update NFL Pregame Odds

on:
  workflow_dispatch:
  schedule:
    # Sunday daytime + Sunday night
    - cron: "*/5 15-23 * * 0"
    - cron: "*/5 0-6 * * 1"

    # Monday night
    - cron: "*/5 22-23 * * 1"
    - cron: "*/5 0-6 * * 2"

    # Thursday night
    - cron: "*/5 22-23 * * 4"
    - cron: "*/5 0-6 * * 5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture and backfill verified NFL pregame odds
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo


          OUT = Path("closing-lines.json")

          ESPN = (
              "https://site.api.espn.com/apis/site/v2/"
              "sports/football/nfl/scoreboard"
          )

          SEARCH = (
              "https://html.duckduckgo.com/html/?q="
          )

          JINA = (
              "https://r.jina.ai/http://"
          )


          # -------------------------------------------------
          # FETCH HELPERS
          # -------------------------------------------------

          def fetch_text(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 "
                          "(Football Fair Price Lookup)",
                      "Accept":
                          "text/html,application/json,text/plain,*/*",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:

                  return response.read().decode(
                      "utf-8",
                      errors="replace",
                  )


          def fetch_json(url):

              text = fetch_text(
                  url
              )

              if not text.strip():

                  raise RuntimeError(
                      "Empty response from "
                      +
                      url
                  )


              try:

                  return json.loads(
                      text
                  )

              except Exception:

                  print(
                      "BAD JSON FROM:"
                  )

                  print(
                      url
                  )

                  print(
                      text[:500]
                  )

                  raise


          # -------------------------------------------------
          # EXISTING JSON RECOVERY
          # -------------------------------------------------

          def valid_json(text):

              if not text:
                  return None


              try:

                  data = json.loads(
                      text
                  )

              except Exception:

                  return None


              if not isinstance(
                  data,
                  dict,
              ):

                  return None


              if not isinstance(
                  data.get(
                      "games",
                      {},
                  ),
                  dict,
              ):

                  return None


              return data


          def recover_existing():

              if OUT.exists():

                  current = valid_json(
                      OUT.read_text(
                          errors="replace"
                      )
                  )


                  if current is not None:

                      print(
                          "Current closing-lines.json valid."
                      )

                      return current


              print(
                  "Current JSON invalid or empty."
              )

              print(
                  "Searching Git history."
              )


              result = subprocess.run(
                  [
                      "git",
                      "log",
                      "--format=%H",
                      "--",
                      "closing-lines.json",
                  ],
                  capture_output=True,
                  text=True,
              )


              for sha in result.stdout.splitlines():

                  sha = sha.strip()


                  if not sha:

                      continue


                  show = subprocess.run(
                      [
                          "git",
                          "show",
                          f"{sha}:closing-lines.json",
                      ],
                      capture_output=True,
                      text=True,
                  )


                  if show.returncode != 0:

                      continue


                  recovered = valid_json(
                      show.stdout
                  )


                  if (
                      recovered
                      and
                      recovered.get(
                          "games"
                      )
                  ):

                      print(
                          "Recovered",
                          len(
                              recovered[
                                  "games"
                              ]
                          ),
                          "games from",
                          sha,
                      )

                      return recovered


              print(
                  "No valid historical JSON found."
              )


              return {
                  "updated_at": None,
                  "games": {},
              }


          # -------------------------------------------------
          # MONEYLINE MATH
          # -------------------------------------------------

          def implied_probability(
              moneyline
          ):

              moneyline = int(
                  moneyline
              )


              if moneyline < 0:

                  return (
                      -moneyline
                      /
                      (
                          -moneyline
                          +
                          100
                      )
                  )


              return (
                  100
                  /
                  (
                      moneyline
                      +
                      100
                  )
              )


          def no_vig_probabilities(
              away_ml,
              home_ml,
          ):

              away_raw = implied_probability(
                  away_ml
              )

              home_raw = implied_probability(
                  home_ml
              )


              total = (
                  away_raw
                  +
                  home_raw
              )


              return (
                  away_raw
                  /
                  total,

                  home_raw
                  /
                  total,
              )


          # -------------------------------------------------
          # ESPN ODDS
          # -------------------------------------------------

          def extract_espn_odds(
              competition
          ):

              odds_list = (
                  competition.get(
                      "odds"
                  )
                  or
                  []
              )


              for item in odds_list:

                  away = (
                      item.get(
                          "awayTeamOdds"
                      )
                      or
                      {}
                  )

                  home = (
                      item.get(
                          "homeTeamOdds"
                      )
                      or
                      {}
                  )


                  away_ml = (
                      away.get(
                          "moneyLine"
                      )
                      or
                      away.get(
                          "moneyline"
                      )
                  )


                  home_ml = (
                      home.get(
                          "moneyLine"
                      )
                      or
                      home.get(
                          "moneyline"
                      )
                  )


                  try:

                      away_ml = int(
                          away_ml
                      )

                      home_ml = int(
                          home_ml
                      )

                  except Exception:

                      continue


                  if (
                      away_ml != 0
                      and
                      home_ml != 0
                  ):

                      return (
                          away_ml,
                          home_ml,
                      )


              return None


          # -------------------------------------------------
          # SEARCH
          # -------------------------------------------------

          def search_urls(
              query,
              required_domain,
          ):

              try:

                  html = fetch_text(
                      SEARCH
                      +
                      urllib.parse.quote(
                          query
                      )
                  )

              except Exception as exc:

                  print(
                      "Search failed:",
                      exc,
                  )

                  return []


              urls = []


              for encoded in re.findall(
                  r'uddg=([^"&]+)',
                  html,
              ):

                  candidate = urllib.parse.unquote(
                      encoded
                  )


                  if (
                      required_domain
                      in
                      candidate
                      and
                      candidate not in urls
                  ):

                      urls.append(
                          candidate
                      )


              return urls[:10]


          # -------------------------------------------------
          # ACTION NETWORK
          # -------------------------------------------------

          def nickname(
              team_name
          ):

              return (
                  team_name
                  .split()[-1]
              )


          def clean_page_text(
              text
          ):

              return (
                  text
                  .replace(
                      "−",
                      "-"
                  )
                  .replace(
                      "–",
                      "-"
                  )
                  .replace(
                      "—",
                      "-"
                  )
              )


          def parse_action_network(
              text,
              away_name,
              home_name,
          ):

              text = clean_page_text(
                  text
              )


              away_nick = nickname(
                  away_name
              )

              home_nick = nickname(
                  home_name
              )


              if not re.search(
                  re.escape(
                      away_nick
                  ),
                  text,
                  flags=re.I,
              ):

                  return None


              if not re.search(
                  re.escape(
                      home_nick
                  ),
                  text,
                  flags=re.I,
              ):

                  return None


              #
              # Look for lines containing a team
              # plus a plausible American moneyline.
              #

              def find_team_ml(
                  team
              ):

                  candidates = []


                  for line in text.splitlines():

                      if not re.search(
                          re.escape(
                              team
                          ),
                          line,
                          flags=re.I,
                      ):

                          continue


                      values = re.findall(
                          r"(?<!\d)"
                          r"([+-]\d{3,4})"
                          r"(?!\d)",
                          line,
                      )


                      for value in values:

                          ml = int(
                              value
                          )


                          if (
                              abs(ml)
                              >= 100
                              and
                              abs(ml)
                              <= 2000
                          ):

                              candidates.append(
                                  ml
                              )


                  if not candidates:

                      return None


                  #
                  # Moneyline is generally the
                  # last +/- 3-4 digit price on
                  # Action Network's team row.
                  #

                  return candidates[
                      -1
                  ]


              away_ml = find_team_ml(
                  away_nick
              )

              home_ml = find_team_ml(
                  home_nick
              )


              if (
                  away_ml is None
                  or
                  home_ml is None
              ):

                  return None


              return (
                  away_ml,
                  home_ml,
              )


          def action_network_lookup(
              away_name,
              home_name,
              game_date,
          ):

              queries = [

                  (
                      "site:actionnetwork.com/nfl-game "
                      f'"{away_name}" '
                      f'"{home_name}"'
                  ),

                  (
                      "site:actionnetwork.com/nfl "
                      f'"{away_name}" '
                      f'"{home_name}" '
                      f'"{game_date}" '
                      "moneyline"
                  ),

              ]


              checked = set()


              for query in queries:

                  urls = search_urls(
                      query,
                      "actionnetwork.com",
                  )


                  for url in urls:

                      clean_url = (
                          url
                          .split("#")[0]
                          .split("?")[0]
                      )


                      if clean_url in checked:

                          continue


                      checked.add(
                          clean_url
                      )


                      reader_url = (
                          JINA
                          +
                          clean_url.replace(
                              "https://",
                              ""
                          )
                      )


                      try:

                          page = fetch_text(
                              reader_url
                          )

                      except Exception:

                          continue


                      result = (
                          parse_action_network(
                              page,
                              away_name,
                              home_name,
                          )
                      )


                      if result:

                          return (
                              result[
                                  0
                              ],
                              result[
                                  1
                              ],
                              clean_url,
                          )


              return None


          # -------------------------------------------------
          # COVERS
          # -------------------------------------------------

          def parse_covers(
              text,
              away_name,
              home_name,
          ):

              text = clean_page_text(
                  text
              )


              away_nick = nickname(
                  away_name
              )

              home_nick = nickname(
                  home_name
              )


              def find_team_ml(
                  team
              ):

                  for line in text.splitlines():

                      if not re.search(
                          re.escape(
                              team
                          ),
                          line,
                          flags=re.I,
                      ):

                          continue


                      values = re.findall(
                          r"(?<!\d)"
                          r"([+-]\d{3,4})"
                          r"(?!\d)",
                          line,
                      )


                      if values:

                          return int(
                              values[
                                  -1
                              ]
                          )


                  return None


              away_ml = find_team_ml(
                  away_nick
              )

              home_ml = find_team_ml(
                  home_nick
              )


              if (
                  away_ml is None
                  or
                  home_ml is None
              ):

                  return None


              return (
                  away_ml,
                  home_ml,
              )


          def covers_lookup(
              away_name,
              home_name,
              game_date,
          ):

              query = (
                  "site:covers.com/sport/football/nfl "
                  f'"{away_name}" '
                  f'"{home_name}" '
                  f'"{game_date}" '
                  "moneyline"
              )


              urls = search_urls(
                  query,
                  "covers.com",
              )


              for url in urls:

                  clean_url = (
                      url
                      .split("#")[0]
                      .split("?")[0]
                  )


                  reader_url = (
                      JINA
                      +
                      clean_url.replace(
                          "https://",
                          ""
                      )
                  )


                  try:

                      page = fetch_text(
                          reader_url
                      )

                  except Exception:

                      continue


                  result = parse_covers(
                      page,
                      away_name,
                      home_name,
                  )


                  if result:

                      return (
                          result[
                              0
                          ],
                          result[
                              1
                          ],
                          clean_url,
                      )


              return None


          # -------------------------------------------------
          # MAIN
          # -------------------------------------------------

          data = recover_existing()

          games = data.setdefault(
              "games",
              {},
          )


          original_games = json.dumps(
              games,
              sort_keys=True,
          )


          now_et = datetime.now(
              ZoneInfo(
                  "America/New_York"
              )
          )


          today = now_et.strftime(
              "%Y%m%d"
          )


          scoreboard = fetch_json(
              ESPN
              +
              "?limit=100&dates="
              +
              today
          )


          print(
              "Today's ESPN events:",
              len(
                  scoreboard.get(
                      "events",
                      [],
                  )
              ),
          )


          added = 0


          for event in scoreboard.get(
              "events",
              [],
          ):

              competitions = (
                  event.get(
                      "competitions"
                  )
                  or
                  []
              )


              if not competitions:

                  continue


              competition = competitions[
                  0
              ]


              game_id = str(
                  event.get(
                      "id"
                  )
              )


              #
              # First verified pair wins forever.
              #

              if game_id in games:

                  print(
                      "Preserving existing:",
                      game_id
                  )

                  continue


              competitors = (
                  competition.get(
                      "competitors",
                      [],
                  )
              )


              away = next(
                  (
                      team
                      for team in competitors
                      if team.get(
                          "homeAway"
                      )
                      ==
                      "away"
                  ),
                  None,
              )


              home = next(
                  (
                      team
                      for team in competitors
                      if team.get(
                          "homeAway"
                      )
                      ==
                      "home"
                  ),
                  None,
              )


              if not away or not home:

                  continue


              away_name = (
                  away
                  .get(
                      "team",
                      {},
                  )
                  .get(
                      "displayName"
                  )
              )


              home_name = (
                  home
                  .get(
                      "team",
                      {},
                  )
                  .get(
                      "displayName"
                  )
              )


              kickoff = datetime.fromisoformat(
                  event[
                      "date"
                  ].replace(
                      "Z",
                      "+00:00",
                  )
              )


              game_date = kickoff.astimezone(
                  ZoneInfo(
                      "America/New_York"
                  )
              ).strftime(
                  "%B %d %Y"
              )


              state = (
                  competition
                  .get(
                      "status",
                      {},
                  )
                  .get(
                      "type",
                      {},
                  )
                  .get(
                      "state"
                  )
              )


              print()
              print(
                  "LOOKING UP:",
                  away_name,
                  "at",
                  home_name,
                  "| state:",
                  state,
              )


              result = None

              source = None

              source_url = None


              # -----------------------------------------
              # 1. ESPN
              # -----------------------------------------

              result = extract_espn_odds(
                  competition
              )


              if result:

                  source = (
                      "ESPN pregame moneyline"
                  )

                  source_url = (
                      "ESPN scoreboard"
                  )


              # -----------------------------------------
              # 2. ACTION NETWORK
              # -----------------------------------------

              if result is None:

                  action = (
                      action_network_lookup(
                          away_name,
                          home_name,
                          game_date,
                      )
                  )


                  if action:

                      result = (
                          action[
                              0
                          ],
                          action[
                              1
                          ],
                      )

                      source = (
                          "Action Network pregame moneyline"
                      )

                      source_url = (
                          action[
                              2
                          ]
                      )


              # -----------------------------------------
              # 3. COVERS
              # -----------------------------------------

              if result is None:

                  covers = (
                      covers_lookup(
                          away_name,
                          home_name,
                          game_date,
                      )
                  )


                  if covers:

                      result = (
                          covers[
                              0
                          ],
                          covers[
                              1
                          ],
                      )

                      source = (
                          "Covers pregame moneyline"
                      )

                      source_url = (
                          covers[
                              2
                          ]
                      )


              # -----------------------------------------
              # STILL NOTHING
              # -----------------------------------------

              if result is None:

                  print(
                      "PREGAME_ODDS_UNAVAILABLE"
                  )

                  continue


              away_ml, home_ml = (
                  result
              )


              away_prob, home_prob = (
                  no_vig_probabilities(
                      away_ml,
                      home_ml,
                  )
              )


              if home_prob >= away_prob:

                  favorite = (
                      home_name
                  )

                  favorite_probability = (
                      home_prob
                  )

              else:

                  favorite = (
                      away_name
                  )

                  favorite_probability = (
                      away_prob
                  )


              games[
                  game_id
              ] = {

                  "event_id":
                      game_id,

                  "away":
                      away_name,

                  "home":
                      home_name,

                  "away_ml":
                      away_ml,

                  "home_ml":
                      home_ml,

                  "away_fair_probability":
                      round(
                          away_prob,
                          6,
                      ),

                  "home_fair_probability":
                      round(
                          home_prob,
                          6,
                      ),

                  "pregame_favorite":
                      favorite,

                  "favorite_probability":
                      round(
                          favorite_probability,
                          6,
                      ),

                  "source":
                      source,

                  "source_url":
                      source_url,

                  "captured_at":
                      datetime.now(
                          timezone.utc
                      ).isoformat(),

              }


              added += 1


              print(
                  "SAVED:"
              )

              print(
                  away_name,
                  away_ml,
                  "/",
                  home_name,
                  home_ml,
              )

              print(
                  "Favorite:",
                  favorite,
                  round(
                      favorite_probability
                      *
                      100,
                      1,
                  ),
                  "%"
              )

              print(
                  "Source:",
                  source,
              )


          # -------------------------------------------------
          # SAVE
          # -------------------------------------------------

          new_games = json.dumps(
              games,
              sort_keys=True,
          )


          current_valid = None


          if OUT.exists():

              current_valid = valid_json(
                  OUT.read_text(
                      errors="replace"
                  )
              )


          if (
              new_games
              !=
              original_games
              or
              current_valid is None
          ):

              data[
                  "updated_at"
              ] = (
                  datetime
                  .now(
                      timezone.utc
                  )
                  .isoformat()
              )


              OUT.write_text(
                  json.dumps(
                      data,
                      indent=2,
                      sort_keys=True,
                  )
                  +
                  "\n"
              )


              print()
              print(
                  "closing-lines.json saved."
              )


          else:

              print()
              print(
                  "No JSON changes."
              )


          print(
              "Added this run:",
              added,
          )


          print(
              "Total stored:",
              len(
                  games
              ),
          )

          PY


      - name: Commit only if JSON changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- closing-lines.json)" ]; then
            echo "No JSON changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add closing-lines.json

          git commit -m "Update verified NFL pregame odds"

          git push
