<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Football Fair-Price Lookup</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111827;
  --card:#182235;
  --border:#2a3850;
  --text:#f8fafc;
  --muted:#a9b5c7;
  --accent:#5ea3ff;
  --warn:#c9a227;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  padding:16px 12px 28px;
}

.wrap{
  max-width:820px;
  margin:auto;
}

h1{
  font-size:24px;
  line-height:1.15;
  margin:0 0 6px;
}

.sub{
  font-size:13px;
  color:var(--muted);
  margin-bottom:14px;
}

.tabs,
.probs{
  display:grid;
  gap:8px;
}

.tabs{
  grid-template-columns:1fr 1fr;
  margin-bottom:14px;
}

.probs{
  grid-template-columns:repeat(2,1fr);
  margin-bottom:14px;
}

@media(min-width:560px){
  .probs{
    grid-template-columns:repeat(4,1fr);
  }
}

button{
  appearance:none;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:11px;
  padding:12px 8px;
  font-size:14px;
  font-weight:750;
  min-height:46px;
}

button.active{
  outline:2px solid var(--accent);
  background:#15243b;
}

.label{
  font-size:13px;
  font-weight:800;
  margin:12px 0 8px;
}

.matrix{
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--panel);
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:520px;
}

th,
td{
  border-bottom:1px solid var(--border);
  padding:9px 7px;
  text-align:center;
}

th:first-child,
td:first-child{
  text-align:left;
}

thead th{
  font-size:12px;
  color:#d9e3f1;
  background:#0f172a;
}

tbody th{
  font-size:14px;
}

.cell{
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
}

.n{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.warn{
  color:var(--warn);
}

.empty{
  color:#67758a;
}

.note{
  font-size:11px;
  color:var(--muted);
  margin-top:8px;
}
</style>
</head>

<body>

<div class="wrap">

<h1>Football Fair-Price Lookup</h1>

<div class="sub">
  Break-even YES prices already include a 1.5% fee.
</div>

<div class="tabs" id="sportTabs">
  <button type="button" data-sport="nfl" class="active">
    NFL
  </button>

  <button type="button" data-sport="cfb">
    College Top 25
  </button>
</div>

<div class="label">
  Pregame favorite probability
</div>

<div id="probButtons" class="probs"></div>

<div class="label">
  Quarter + favorite lead
</div>

<div class="matrix">
<table>
<thead>
<tr id="headRow"></tr>
</thead>

<tbody id="gridBody"></tbody>
</table>
</div>

<div class="note" id="note"></div>

</div>

<script>

  }
},

  },

    "4–7":[83,29],
    "8+":[96,104]
  }
},

"75–84%": {

    "8+":[93,5]
  },
  2: {
    "1–3":[80,14],
    "4–7":[85,14],
    "8+":[93,38]
  },
  3: {
    "1–3":[75,8],

  },
  4: {
    "1–3":[75,8],
    "4–7":[85,13],
    "8+":[97,67]
  }
},

"85%+": {
  1: {
    "1–3":[88,4],
    "4–7":[94,8],
    "8+":[93,1]
  },
  2: {
    "1–3":[84,8],
    "4–7":[88,11],
    "8+":[94,23]
  },
  3: {
    "1–3":[84,1],
    "4–7":[89,7],
    "8+":[96,16]
  },
  4: {
    "1–3":[84,1],
    "4–7":[90,5],
    "8+":[98,30]
  }
}

};


const CFB = {

"50–69%": {
  1: {
    "1–7":[76.6,23],
    "8–14":[86.4,6],
    "15–21":[null,0],
    "22+":[null,0]
  },
  2: {
    "1–7":[73.9,27],
    "8–14":[86.4,17],
    "15–21":[94.4,6],
    "22+":[97.8,3]
  },
  3: {
    "1–7":[71.6,27],
    "8–14":[87.2,14],
    "15–21":[95.8,8],
    "22+":[98.3,8]
  },
  4: {
    "1–7":[78.4,28],
    "8–14":[95.1,16],
    "15–21":[97.8,9],
    "22+":[98.4,12]
  }
},

"70–84%": {
  1: {

  },
  2: {

  },
  3: {

  },
  4: {

  }
},

"85–94%": {
  1: {

    "22+":[null,0]
  },
  2: {
    "1–7":[87.4,25],
    "8–14":[93.9,21],

    "22+":[98.3,4]
  },
  3: {
    "1–7":[84.8,11],

  },
  4: {
    "1–7":[84.6,14],

    "22+":[98.5,18]
  }
},

"95%+": {
  1: {
    "1–7":[96.5,43],

    "15–21":[98.0,5],
    "22+":[98.4,1]
  },
  2: {
    "1–7":[94.5,17],
    "8–14":[96.6,31],
    "15–21":[98.0,34],
    "22+":[98.4,25]
  },
  3: {
    "1–7":[88.6,6],
    "8–14":[95.1,15],
    "15–21":[97.8,14],
    "22+":[98.4,39]
  },
  4: {
    "1–7":[84.9,6],
    "8–14":[97.2,8],
    "15–21":[98.2,12],
    "22+":[98.5,46]
  }
}

};


const CONFIG = {

  nfl: {
    data:NFL,
    leads:["1–3","4–7","8+"],
    note:"NFL: Weeks 1–10 sample. ⚠ = fewer than 10 games."
  },

  cfb: {
    data:CFB,
    leads:["1–7","8–14","15–21","22+"],
    note:"College: 2023–2025 AP Top-25 favorite sample. ⚠ = fewer than 10 games."
  }

};


let sport = "nfl";

let bucket = Object.keys(NFL)[1];


const probButtons =
  document.getElementById("probButtons");

const gridBody =
  document.getElementById("gridBody");

const headRow =
  document.getElementById("headRow");

const note =
  document.getElementById("note");


function fmt(v){

  if(v === null || v === undefined){
    return "—";
  }

  const rounded =
    Math.round(v * 10) / 10;

  if(Number.isInteger(rounded)){
    return rounded.toFixed(0) + "¢";
  }

  return rounded.toFixed(1) + "¢";
}


function renderTabs(){

  document
    .querySelectorAll("#sportTabs button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.sport === sport
      );

    });

}


function renderProbButtons(){

  const cfg = CONFIG[sport];

  const keys =
    Object.keys(cfg.data);

  if(!keys.includes(bucket)){
    bucket = keys[0];
  }

  probButtons.innerHTML = "";

  keys.forEach(k => {

    const button =
      document.createElement("button");

    button.type = "button";

    button.textContent = k;

    if(k === bucket){
      button.classList.add("active");
    }

    button.addEventListener(
      "click",
      () => {

        bucket = k;

        renderProbButtons();

        renderTable();

      }
    );

    probButtons.appendChild(button);

  });

}


function renderTable(){

  const cfg =
    CONFIG[sport];

  headRow.innerHTML =
    "<th>Quarter</th>" +
    cfg.leads
      .map(lead => "<th>Lead " + lead + "</th>")
      .join("");

  gridBody.innerHTML = "";

  [1,2,3,4].forEach(q => {

    const tr =
      document.createElement("tr");

    tr.innerHTML =
      "<th>Q" + q + "</th>";

    cfg.leads.forEach(lead => {

      const td =
        document.createElement("td");

      const pair =
        cfg.data[bucket][q][lead];

      const value =
        pair[0];

      const n =
        pair[1];

      if(value === null){

        td.innerHTML =
          '<div class="cell empty">—</div>' +
          '<div class="n">n=0</div>';

      } else {

        td.innerHTML =
          '<div class="cell">' +
          fmt(value) +
          (n < 10
            ? ' <span class="warn">⚠</span>'
            : '') +
          '</div>' +
          '<div class="n">n=' +
          n +
          '</div>';

      }

      tr.appendChild(td);

    });

    gridBody.appendChild(tr);

  });

  note.textContent =
    cfg.note;

}


document
  .querySelectorAll("#sportTabs button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        sport =
          button.dataset.sport;

        bucket =
          Object.keys(CONFIG[sport].data)[0];

        renderTabs();

        renderProbButtons();

        renderTable();

      }
    );

  });


renderTabs();

renderProbButtons();

renderTable();

</script>

</body>
</html>
