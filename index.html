<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0b1220"
>

<title>Football Fair-Price Lookup</title>

<style>

:root{
  --bg:#0b1220;
  --panel:#111827;
  --panel2:#15243b;
  --border:#2a3850;
  --text:#f8fafc;
  --muted:#9fb0c5;
  --accent:#5ea3ff;
  --price:#facc15;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
  padding:
    16px
    12px
    32px;
}

.wrap{
  max-width:720px;
  margin:auto;
}

h1{
  margin:0 0 5px;
  font-size:24px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:16px;
}

.label{
  font-size:13px;
  font-weight:800;
  margin:18px 0 8px;
}

.grid{
  display:grid;
  gap:8px;
}

.sports{
  grid-template-columns:
    1fr
    1fr;
}

.probs{
  grid-template-columns:
    repeat(2,1fr);
}

button{
  appearance:none;

  border:
    1px
    solid
    var(--border);

  background:
    var(--panel);

  color:
    var(--text);

  border-radius:
    11px;

  padding:
    12px
    7px;

  min-height:
    46px;

  font-size:
    14px;

  font-weight:
    800;
}

button.active{
  background:
    var(--panel2);

  outline:
    2px
    solid
    var(--accent);
}

.card{
  margin-top:16px;

  padding:
    17px
    16px;

  border:
    1px
    solid
    var(--border);

  background:
    var(--panel);

  border-radius:
    14px;
}

.controlTitle{
  text-align:center;

  color:
    var(--muted);

  font-size:
    13px;

  font-weight:
    700;
}

.bigValue{
  text-align:center;

  font-size:
    38px;

  font-weight:
    950;

  margin:
    5px
    0
    10px;
}

input[type="range"]{
  width:100%;

  margin:
    10px
    0
    4px;
}

.rangeMarks{
  display:flex;

  justify-content:
    space-between;

  color:
    var(--muted);

  font-size:
    11px;
}


/* =========================
   BREAK-EVEN RESULT
   ========================= */


.breakEvenBox{
  margin-top:18px;

  padding:
    24px
    12px;

  background:
    var(--panel);

  border:
    2px
    solid
    var(--price);

  border-radius:
    15px;

  text-align:center;
}

.breakEvenLabel{
  color:
    var(--text);

  font-size:
    14px;

  font-weight:
    900;

  letter-spacing:
    .7px;
}

.breakEvenPrice{
  color:
    var(--price);

  font-size:
    68px;

  line-height:
    1;

  font-weight:
    950;

  margin-top:
    10px;
}

.winProb{
  margin-top:
    9px;

  color:
    var(--muted);

  font-size:
    13px;
}

.footer{
  margin-top:
    14px;

  color:
    var(--muted);

  font-size:
    10px;

  line-height:
    1.4;

  text-align:center;
}


@media(min-width:560px){

  .probs{
    grid-template-columns:
      repeat(4,1fr);
  }

}

</style>
</head>


<body>

<div class="wrap">


<h1>
Football Fair-Price Lookup
</h1>


<div class="sub">
NFL + College Top 25 • Flat 1.5¢ fee already included
</div>



<div class="label">
Sport
</div>


<div
  class="grid sports"
  id="sportButtons"
>

<button
  type="button"
  data-sport="nfl"
  class="active"
>
NFL
</button>


<button
  type="button"
  data-sport="cfb"
>
College Top 25
</button>

</div>



<div class="label">
Pregame favorite probability
</div>


<div
  class="grid probs"
  id="probButtons"
>
</div>



<div class="card">

<div class="controlTitle">
Game time remaining
</div>


<div
  class="bigValue"
  id="timeValue"
>
30 min
</div>


<input
  id="timeSlider"
  type="range"
  min="0"
  max="60"
  step="1"
  value="30"
>


<div class="rangeMarks">
<span>0</span>
<span>15</span>
<span>30</span>
<span>45</span>
<span>60</span>
</div>

</div>



<div class="card">

<div class="controlTitle">
Favorite score differential
</div>


<div
  class="bigValue"
  id="scoreValue"
>
0
</div>


<input
  id="scoreSlider"
  type="range"
  min="-7"
  max="15"
  step="1"
  value="0"
>


<div class="rangeMarks">
<span>-7</span>
<span>0</span>
<span>+7</span>
<span>+15</span>
</div>

</div>



<div class="breakEvenBox">

<div class="breakEvenLabel">
YES BREAK-EVEN PRICE
</div>


<div
  class="breakEvenPrice"
  id="breakEven"
>
—
</div>


<div
  class="winProb"
  id="winProb"
>
</div>

</div>



<div
  class="footer"
  id="footer"
>
</div>


</div>



<script>


/* ==================================================
   NFL SMOOTH MODEL V1
   2023–2025
   ================================================== */


const NFL_MODEL = {

  theta:[
    0.17012575,
    -0.16845319,
    0.06884716,

    -2.17766428,
    5.29263532,
    -3.33886741,

    -0.76228060,
    -3.65009808,
    2.50030781
  ],

  probabilities:{

    "50–64%":
      0.5884945989,

    "65–74%":
      0.7101917863,

    "75–84%":
      0.7694025189,

    "85%+":
      0.8740328625

  },

  label:
    "NFL Smooth Model v1 • 2023–2025"

};



/* ==================================================
   COLLEGE TOP-25 SMOOTH MODEL
   2023–2025
   ================================================== */


const CFB_MODEL = {

  theta:[
    -1.32202390,
    4.33068028,
    -3.11739263,

    -0.17624777,
    0.13508128,
    0.80771874,

    -0.87799969,
    -2.91181985,
    0.36748140
  ],

  probabilities:{

    "50–69%":
      0.5947557145,

    "70–84%":
      0.7660083851,

    "85–94%":
      0.8979099534,

    "95%+":
      0.9852538025

  },

  label:
    "College Top 25 Smooth Model • 2023–2025"

};



/* ==================================================
   APP STATE
   ================================================== */


let sport =
  "nfl";

let probabilityLabel =
  "50–64%";

let minutesRemaining =
  30;

let scoreDifferential =
  0;



/* ==================================================
   ELEMENTS
   ================================================== */


const probButtons =
  document.getElementById(
    "probButtons"
  );


const timeSlider =
  document.getElementById(
    "timeSlider"
  );


const scoreSlider =
  document.getElementById(
    "scoreSlider"
  );


const timeValue =
  document.getElementById(
    "timeValue"
  );


const scoreValue =
  document.getElementById(
    "scoreValue"
  );


const breakEven =
  document.getElementById(
    "breakEven"
  );


const winProb =
  document.getElementById(
    "winProb"
  );


const footer =
  document.getElementById(
    "footer"
  );



/* ==================================================
   HELPERS
   ================================================== */


function sigmoid(z){

  if(z > 35){
    return 1;
  }

  if(z < -35){
    return 0;
  }

  return (
    1 /
    (
      1 +
      Math.exp(-z)
    )
  );

}



function logit(p){

  p =
    Math.max(
      0.00001,
      Math.min(
        0.99999,
        p
      )
    );


  return Math.log(
    p /
    (
      1-p
    )
  );

}



function currentModel(){

  if(
    sport === "nfl"
  ){

    return NFL_MODEL;

  }

  return CFB_MODEL;

}



function formatScore(x){

  if(
    x > 0
  ){

    return (
      "+"
      +
      x
    );

  }


  return String(x);

}



function formatPrice(x){

  const value =
    Math.round(
      x * 10
    )
    /
    10;


  if(
    Number.isInteger(
      value
    )
  ){

    return (
      value.toFixed(0)
      +
      "¢"
    );

  }


  return (
    value.toFixed(1)
    +
    "¢"
  );

}



/* ==================================================
   CONTINUOUS PROBABILITY MODEL
   ================================================== */


function calculateProbability(){

  const model =
    currentModel();


  const theta =
    model.theta;


  const pregame =
    model
      .probabilities
      [probabilityLabel];


  /*
  t = fraction of game remaining

  60 minutes = 1.0
  30 minutes = 0.5
  0 minutes = 0.0
  */


  const t =
    minutesRemaining
    /
    60;


  const t2 =
    t * t;


  const pregameLogOdds =
    logit(
      pregame
    );


  const intercept =
    theta[0]
    +
    theta[1]
      *
      t
    +
    theta[2]
      *
      t2;


  /*
  Exponential weights keep the
  pregame and score effects positive.
  */


  const pregameWeight =
    Math.exp(

      theta[3]
      +
      theta[4]
        *
        t
      +
      theta[5]
        *
        t2

    );


  const scoreWeight =
    Math.exp(

      theta[6]
      +
      theta[7]
        *
        t
      +
      theta[8]
        *
        t2

    );


  const z =
    intercept

    +

    pregameWeight
      *
      pregameLogOdds

    +

    scoreWeight
      *
      scoreDifferential;


  return sigmoid(z);

}



/* ==================================================
   BREAK-EVEN YES PRICE
   ================================================== */


function calculateBreakEven(){

  const probability =
    calculateProbability();


  /*
  Flat 1.5 CENT fee per contract.

  This is NOT 1.5 percent.
  */


  let cents =
    probability
      *
      100

    -

    1.5;


  cents =
    Math.max(
      0,
      Math.min(
        98.5,
        cents
      )
    );


  return {

    probability:
      probability,

    cents:
      cents

  };

}



/* ==================================================
   PROBABILITY BUTTONS
   ================================================== */


function renderProbabilityButtons(){

  const model =
    currentModel();


  const labels =
    Object.keys(
      model.probabilities
    );


  if(
    !labels.includes(
      probabilityLabel
    )
  ){

    probabilityLabel =
      labels[0];

  }


  probButtons.innerHTML =
    "";


  labels.forEach(
    label=>{


      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.textContent =
        label;


      if(
        label ===
        probabilityLabel
      ){

        button
          .classList
          .add(
            "active"
          );

      }


      button.addEventListener(
        "click",
        ()=>{


          probabilityLabel =
            label;


          renderProbabilityButtons();


          renderResult();

        }
      );


      probButtons
        .appendChild(
          button
        );

    }
  );

}



/* ==================================================
   RENDER RESULT
   ================================================== */


function renderResult(){

  timeValue.textContent =
    minutesRemaining
    +
    " min";


  scoreValue.textContent =
    formatScore(
      scoreDifferential
    );


  const result =
    calculateBreakEven();


  breakEven.textContent =
    formatPrice(
      result.cents
    );


  winProb.textContent =
    "Modeled favorite win probability: "
    +
    (
      result.probability
      *
      100
    ).toFixed(1)
    +
    "%";


  footer.textContent =
    currentModel()
      .label
    +
    " • Flat 1.5¢ fee included";

}



/* ==================================================
   SPORT BUTTONS
   ================================================== */


document
  .querySelectorAll(
    "#sportButtons button"
  )
  .forEach(
    button=>{


      button.addEventListener(
        "click",
        ()=>{


          sport =
            button
              .dataset
              .sport;


          document
            .querySelectorAll(
              "#sportButtons button"
            )
            .forEach(
              b=>{


                b
                  .classList
                  .toggle(
                    "active",
                    b === button
                  );

              }
            );


          probabilityLabel =
            Object.keys(
              currentModel()
                .probabilities
            )[0];


          renderProbabilityButtons();


          renderResult();

        }
      );

    }
  );



/* ==================================================
   TIME SLIDER
   ================================================== */


timeSlider.addEventListener(
  "input",
  ()=>{


    minutesRemaining =
      Number(
        timeSlider.value
      );


    renderResult();

  }
);



/* ==================================================
   SCORE SLIDER
   ================================================== */


scoreSlider.addEventListener(
  "input",
  ()=>{


    scoreDifferential =
      Number(
        scoreSlider.value
      );


    renderResult();

  }
);



/* ==================================================
   START
   ================================================== */


renderProbabilityButtons();

renderResult();


</script>

</body>
</html>
