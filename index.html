<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Football Fair-Price Lookup</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111827;
  --border:#2a3850;
  --text:#f8fafc;
  --muted:#a9b5c7;
  --accent:#5ea3ff;
  --warn:#d8a800;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  padding:16px 12px 28px;
}

.wrap{
  max-width:820px;
  margin:auto;
}

h1{
  font-size:24px;
  margin:0 0 6px;
}

.sub{
  font-size:13px;
  color:var(--muted);
  margin-bottom:14px;
}

.tabs,
.probs{
  display:grid;
  gap:8px;
}

.tabs{
  grid-template-columns:1fr 1fr;
  margin-bottom:14px;
}

.probs{
  grid-template-columns:repeat(2,1fr);
  margin-bottom:14px;
}

@media(min-width:560px){
  .probs{
    grid-template-columns:repeat(4,1fr);
  }
}

button{
  appearance:none;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:11px;
  padding:12px 8px;
  font-size:14px;
  font-weight:750;
  min-height:46px;
}

button.active{
  outline:2px solid var(--accent);
  background:#15243b;
}

.label{
  font-size:13px;
  font-weight:800;
  margin:12px 0 8px;
}

.matrix{
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--panel);
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:520px;
}

th,
td{
  border-bottom:1px solid var(--border);
  padding:9px 7px;
  text-align:center;
}

th:first-child,
td:first-child{
  text-align:left;
}

thead th{
  font-size:12px;
  color:#d9e3f1;
  background:#0f172a;
}

tbody th{
  font-size:14px;
}

.cell{
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
}

.n{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.warn{
  color:var(--warn);
}

.empty{
  color:#67758a;
}

.note{
  font-size:11px;
  color:var(--muted);
  margin-top:8px;
  line-height:1.35;
}
</style>
</head>

<body>

<div class="wrap">

<h1>Football Fair-Price Lookup</h1>

<div class="sub">
  Break-even YES prices already include a 1.5% fee.
</div>

<div class="tabs" id="sportTabs">

  <button
    type="button"
    data-sport="nfl"
    class="active">
    NFL
  </button>

  <button
    type="button"
    data-sport="cfb">
    College Top 25
  </button>

</div>

<div class="label">
  Pregame favorite probability
</div>

<div
  id="probButtons"
  class="probs">
</div>

<div class="label">
  Quarter + favorite lead
</div>

<div class="matrix">

<table>

<thead>
<tr id="headRow"></tr>
</thead>

<tbody id="gridBody"></tbody>

</table>

</div>

<div
  class="note"
  id="note">
</div>

</div>


<script>

  },

  }

},


"85%+": {

  "Q1":{

    "8+":[93,1]
  },

  "Q2":{

  },

  },

  "Q3":{
    "1–3":[65.5,11],

    "8–14":[87.2,14],

  },

  "Q4":{
    "1–3":[69.5,12],

  },

  },

    "1–3":[82,2],

},


"95%+": {

  "Q1":{

  },

  "Q2":{
    "1–3":[92.9,2],

  },

  },

    "1–3":[82.7,5],

    "8–14":[97.2,8],
    "15+":[98.5,54]
  }

}

};


const CONFIG = {

  nfl:{
    data:NFL,
    leads:[
      "1–3",
      "4–7",
      "8+"
    ],
    note:
      "NFL: Weeks 1–10 sample. ⚠ = fewer than 10 games."
  },

  cfb:{
    data:CFB,
    leads:[
      "1–3",
      "4–7",
      "8–14",
      "15+"
    ],
    note:
      "College: 2023–2025 AP Top-25 favorite sample. ⚠ = fewer than 10 games."
  }

};


let sport = "nfl";

let bucket = "65–74%";


const probButtons =
  document.getElementById(
    "probButtons"
  );

const gridBody =
  document.getElementById(
    "gridBody"
  );

const headRow =
  document.getElementById(
    "headRow"
  );

const note =
  document.getElementById(
    "note"
  );


function fmt(v){

  if(
    v === null ||
    v === undefined
  ){
    return "—";
  }

  const x =
    Math.round(v * 10) / 10;

  if(
    Number.isInteger(x)
  ){
    return x.toFixed(0) + "¢";
  }

  return x.toFixed(1) + "¢";

}


function renderTabs(){

  document
    .querySelectorAll(
      "#sportTabs button"
    )
    .forEach(
      button => {

        button
          .classList
          .toggle(
            "active",
            button.dataset.sport === sport
          );

      }
    );

}


function renderProbButtons(){

  const keys =
    Object.keys(
      CONFIG[sport].data
    );

  if(
    !keys.includes(bucket)
  ){
    bucket = keys[0];
  }

  probButtons.innerHTML = "";

  keys.forEach(
    key => {

      const button =
        document.createElement(
          "button"
        );

      button.type = "button";

      button.textContent = key;

      if(
        key === bucket
      ){
        button
          .classList
          .add(
            "active"
          );
      }

      button
        .addEventListener(
          "click",
          () => {

            bucket = key;

            renderProbButtons();

            renderTable();

          }
        );

      probButtons
        .appendChild(
          button
        );

    }
  );

}


function renderTable(){

  const cfg =
    CONFIG[sport];

  headRow.innerHTML =
    "<th>Quarter</th>" +
    cfg.leads
      .map(
        lead =>
          "<th>Lead " +
          lead +
          "</th>"
      )
      .join("");

  gridBody.innerHTML = "";

  [
    "Q1",
    "Q2",
    "Q3",
    "Q4"
  ]
  .forEach(
    quarter => {

      const tr =
        document.createElement(
          "tr"
        );

      tr.innerHTML =
        "<th>" +
        quarter +
        "</th>";

      cfg.leads
        .forEach(
          lead => {

            const pair =
              cfg
                .data
                [bucket]
                [quarter]
                [lead];

            const value =
              pair[0];

            const n =
              pair[1];

            const td =
              document.createElement(
                "td"
              );

            if(
              value === null
            ){

              td.innerHTML =
                '<div class="cell empty">—</div>' +
                '<div class="n">n=0</div>';

            } else {

              td.innerHTML =
                '<div class="cell">' +
                fmt(value) +
                (
                  n < 10
                    ? ' <span class="warn">⚠</span>'
                    : ''
                ) +
                '</div>' +
                '<div class="n">n=' +
                n +
                '</div>';

            }

            tr.appendChild(
              td
            );

          }
        );

      gridBody.appendChild(
        tr
      );

    }
  );

  note.textContent =
    cfg.note;

}


document
  .querySelectorAll(
    "#sportTabs button"
  )
  .forEach(
    button => {

      button
        .addEventListener(
          "click",
          () => {

            sport =
              button.dataset.sport;

            bucket =
              Object.keys(
                CONFIG[sport].data
              )[0];

            renderTabs();

            renderProbButtons();

            renderTable();

          }
        );

    }
  );


renderTabs();

renderProbButtons();

renderTable();

</script>

</html>
