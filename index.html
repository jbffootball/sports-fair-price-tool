<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0b1220"
>

<title>Football Fair-Price Lookup</title>

<style>

:root{
  --bg:#0b1220;
  --panel:#111827;
  --panel2:#15243b;
  --border:#2a3850;
  --text:#f8fafc;
  --muted:#9fb0c5;
  --accent:#5ea3ff;
  --pass:#94a3b8;
  --buy:#f4c84a;
  --strong:#4ade80;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
  padding:
    16px
    12px
    32px;
}

.wrap{
  max-width:720px;
  margin:auto;
}

h1{
  margin:0 0 5px;
  font-size:24px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:16px;
}

.label{
  font-size:13px;
  font-weight:800;
  margin:18px 0 8px;
}

.grid{
  display:grid;
  gap:8px;
}

.sports{
  grid-template-columns:
    1fr
    1fr;
}

.probs{
  grid-template-columns:
    repeat(2,1fr);
}

button{
  appearance:none;
  border:
    1px
    solid
    var(--border);

  background:
    var(--panel);

  color:
    var(--text);

  border-radius:
    11px;

  padding:
    12px
    7px;

  min-height:
    46px;

  font-size:
    14px;

  font-weight:
    800;
}

button.active{
  background:
    var(--panel2);

  outline:
    2px
    solid
    var(--accent);
}

.card{
  margin-top:16px;

  padding:
    17px
    16px;

  border:
    1px
    solid
    var(--border);

  background:
    var(--panel);

  border-radius:
    14px;
}

.controlTitle{
  text-align:center;

  color:
    var(--muted);

  font-size:
    13px;

  font-weight:
    700;
}

.bigValue{
  text-align:center;

  font-size:
    38px;

  font-weight:
    950;

  margin:
    5px
    0
    10px;
}

input[type="range"]{
  width:100%;
  margin:
    10px
    0
    4px;
}

.rangeMarks{
  display:flex;
  justify-content:space-between;

  color:
    var(--muted);

  font-size:
    11px;
}

.askInput{
  width:100%;

  border:
    1px
    solid
    var(--border);

  background:
    #0f172a;

  color:
    var(--text);

  border-radius:
    11px;

  padding:
    13px
    14px;

  font-size:
    18px;

  font-weight:
    800;

  outline:none;
}

.askInput:focus{
  border-color:
    var(--accent);
}

.result{
  margin-top:18px;

  padding:
    22px
    14px;

  background:
    var(--panel);

  border:
    1px
    solid
    var(--border);

  border-radius:
    14px;

  text-align:center;
}

.resultLabel{
  color:
    var(--muted);

  font-size:
    13px;

  font-weight:
    800;

  text-transform:
    uppercase;

  letter-spacing:
    .5px;
}

.price{
  font-size:
    58px;

  line-height:
    1.05;

  font-weight:
    950;

  margin-top:
    8px;
}

.winProb{
  margin-top:
    5px;

  color:
    var(--muted);

  font-size:
    13px;
}

.tradeBox{
  display:none;

  margin-top:
    15px;

  padding:
    13px;

  border-radius:
    11px;

  font-size:
    20px;

  font-weight:
    950;
}

.tradeBox.pass{
  display:block;
  color:var(--pass);
  border:1px solid var(--pass);
}

.tradeBox.buy{
  display:block;
  color:var(--buy);
  border:1px solid var(--buy);
}

.tradeBox.strong{
  display:block;
  color:var(--strong);
  border:1px solid var(--strong);
}

.discount{
  margin-top:
    6px;

  font-size:
    12px;

  font-weight:
    700;
}

.footer{
  margin-top:
    12px;

  color:
    var(--muted);

  font-size:
    10px;

  line-height:
    1.4;

  text-align:center;
}

@media(min-width:560px){

  .probs{
    grid-template-columns:
      repeat(4,1fr);
  }

}

</style>
</head>

<body>

<div class="wrap">

<h1>
Football Fair-Price Lookup
</h1>

<div class="sub">
Theoretical break-even YES price.
Flat 1.5¢ fee per contract already subtracted.
</div>


<div class="label">
Sport
</div>

<div
  class="grid sports"
  id="sportButtons"
>

<button
  type="button"
  data-sport="nfl"
  class="active"
>
NFL
</button>

<button
  type="button"
  data-sport="cfb"
>
College Top 25
</button>

</div>


<div class="label">
Pregame favorite probability
</div>

<div
  class="grid probs"
  id="probButtons"
>
</div>


<div class="card">

<div class="controlTitle">
Game time remaining
</div>

<div
  class="bigValue"
  id="timeValue"
>
30 min
</div>

<input
  id="timeSlider"
  type="range"
  min="0"
  max="60"
  step="1"
  value="30"
>

<div class="rangeMarks">
<span>0</span>
<span>15</span>
<span>30</span>
<span>45</span>
<span>60</span>
</div>

</div>


<div class="card">

<div class="controlTitle">
Favorite score differential
</div>

<div
  class="bigValue"
  id="scoreValue"
>
0
</div>

<input
  id="scoreSlider"
  type="range"
  min="-7"
  max="15"
  step="1"
  value="0"
>

<div class="rangeMarks">
<span>-7</span>
<span>0</span>
<span>+7</span>
<span>+15</span>
</div>

</div>


<div class="label">
Kalshi YES ask — optional
</div>

<input
  id="askInput"
  class="askInput"
  type="number"
  inputmode="decimal"
  min="0"
  max="99"
  step="0.1"
  placeholder="Example: 55"
>


<div class="result">

<div class="resultLabel">
Break-even YES price
</div>

<div
  class="price"
  id="breakEven"
>
—
</div>

<div
  class="winProb"
  id="winProb"
>
</div>

<div
  class="tradeBox"
  id="tradeBox"
>
</div>

</div>


<div
  class="footer"
  id="footer"
>
</div>

</div>


<script>

/*
==================================================
NFL SMOOTH MODEL V1
==================================================

Fit independently from NFL completed-possession
states covering 2023, 2024, and 2025.

Inputs:

- pregame favorite probability
- exact score differential
- exact seconds remaining

Model:

logit(P) =
time intercept
+
positive time-varying weight × pregame log-odds
+
positive time-varying weight × score differential

Positive score coefficient guarantees that
increasing the favorite's lead cannot lower
its modeled probability.
*/


const NFL_MODEL = {

theta:[
  0.17012575,
  -0.16845319,
  0.06884716,

  -2.17766428,
  5.29263532,
  -3.33886741,

  -0.76228060,
  -3.65009808,
  2.50030781
],

probabilities:{

  "50–64%":
    0.5884945989,

  "65–74%":
    0.7101917863,

  "75–84%":
    0.7694025189,

  "85%+":
    0.8740328625

},

label:
  "NFL Smooth Model v1 • 2023–2025 • 17,650 completed-possession states"

};


/*
==================================================
COLLEGE TOP-25 SMOOTH MODEL
==================================================

Fit independently from the 2023–2025
Top-25 college state dataset.

This is NOT using the NFL coefficients.
*/


const CFB_MODEL = {

theta:[
  -1.32202390,
  4.33068028,
  -3.11739263,

  -0.17624777,
  0.13508128,
  0.80771874,

  -0.87799969,
  -2.91181985,
  0.36748140
],

probabilities:{

  "50–69%":
    0.5947557145,

  "70–84%":
    0.7660083851,

  "85–94%":
    0.8979099534,

  "95%+":
    0.9852538025

},

label:
  "College Top 25 Smooth Model • 2023–2025"

};


/*
==================================================
APP STATE
==================================================
*/


let sport =
  "nfl";

let probabilityLabel =
  "50–64%";

let minutesRemaining =
  30;

let scoreDifferential =
  0;


/*
==================================================
ELEMENTS
==================================================
*/


const probButtons =
  document.getElementById(
    "probButtons"
  );

const timeSlider =
  document.getElementById(
    "timeSlider"
  );

const scoreSlider =
  document.getElementById(
    "scoreSlider"
  );

const timeValue =
  document.getElementById(
    "timeValue"
  );

const scoreValue =
  document.getElementById(
    "scoreValue"
  );

const breakEven =
  document.getElementById(
    "breakEven"
  );

const winProb =
  document.getElementById(
    "winProb"
  );

const askInput =
  document.getElementById(
    "askInput"
  );

const tradeBox =
  document.getElementById(
    "tradeBox"
  );

const footer =
  document.getElementById(
    "footer"
  );


/*
==================================================
HELPERS
==================================================
*/


function sigmoid(z){

  if(z > 35){
    return 1;
  }

  if(z < -35){
    return 0;
  }

  return (
    1 /
    (
      1 +
      Math.exp(-z)
    )
  );

}


function logit(p){

  p =
    Math.max(
      0.00001,
      Math.min(
        0.99999,
        p
      )
    );

  return Math.log(
    p /
    (
      1-p
    )
  );

}


function formatScore(x){

  if(x > 0){
    return "+" + x;
  }

  return String(x);

}


function formatPrice(x){

  const v =
    Math.round(
      x * 10
    ) / 10;

  if(
    Number.isInteger(v)
  ){

    return (
      v.toFixed(0)
      +
      "¢"
    );

  }

  return (
    v.toFixed(1)
    +
    "¢"
  );

}


function currentModel(){

  if(
    sport === "nfl"
  ){

    return NFL_MODEL;

  }

  return CFB_MODEL;

}


/*
==================================================
CONTINUOUS PROBABILITY MODEL
==================================================
*/


function modelProbability(){

  const model =
    currentModel();

  const theta =
    model.theta;

  const pregame =
    model
      .probabilities
      [probabilityLabel];


  /*
  Model uses fraction of full game remaining.

  60 minutes remaining = 1
  0 minutes remaining = 0
  */

  const t =
    minutesRemaining
    /
    60;

  const t2 =
    t * t;


  const pregameLogOdds =
    logit(
      pregame
    );


  const intercept =
    theta[0]
    +
    theta[1] * t
    +
    theta[2] * t2;


  /*
  Exponentiation forces these weights
  to remain positive.
  */

  const pregameWeight =
    Math.exp(
      theta[3]
      +
      theta[4] * t
      +
      theta[5] * t2
    );


  const scoreWeight =
    Math.exp(
      theta[6]
      +
      theta[7] * t
      +
      theta[8] * t2
    );


  const z =
    intercept
    +
    pregameWeight
      *
      pregameLogOdds
    +
    scoreWeight
      *
      scoreDifferential;


  return sigmoid(z);

}


/*
==================================================
BREAK-EVEN PRICE
==================================================

Flat 1.5 CENT fee.

Not 1.5 percent.
*/


function getBreakEven(){

  const probability =
    modelProbability();


  let cents =
    probability * 100
    -
    1.5;


  cents =
    Math.max(
      0,
      Math.min(
        98.5,
        cents
      )
    );


  return {

    probability:
      probability,

    cents:
      cents

  };

}


/*
==================================================
PROBABILITY BUTTONS
==================================================
*/


function renderProbabilityButtons(){

  const model =
    currentModel();


  const labels =
    Object.keys(
      model.probabilities
    );


  if(
    !labels.includes(
      probabilityLabel
    )
  ){

    probabilityLabel =
      labels[0];

  }


  probButtons.innerHTML =
    "";


  labels.forEach(
    label=>{

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.textContent =
        label;


      if(
        label ===
        probabilityLabel
      ){

        button
          .classList
          .add(
            "active"
          );

      }


      button.addEventListener(
        "click",
        ()=>{

          probabilityLabel =
            label;


          renderProbabilityButtons();

          renderResult();

        }
      );


      probButtons
        .appendChild(
          button
        );

    }
  );

}


/*
==================================================
TRADE CLASSIFICATION
==================================================
*/


function renderTradeClassification(
  fairCents
){

  const raw =
    askInput.value.trim();


  if(
    raw === ""
  ){

    tradeBox.className =
      "tradeBox";

    tradeBox.textContent =
      "";

    return;

  }


  const ask =
    Number(raw);


  if(
    !Number.isFinite(ask)
  ){

    tradeBox.className =
      "tradeBox";

    tradeBox.textContent =
      "";

    return;

  }


  const discount =
    fairCents
    -
    ask;


  let classification;
  let cssClass;


  if(
    discount >= 10
  ){

    classification =
      "STRONG BUY candidate";

    cssClass =
      "strong";

  }


  else if(
    discount >= 5
  ){

    classification =
      "BUY candidate";

    cssClass =
      "buy";

  }


  else{

    classification =
      "PASS";

    cssClass =
      "pass";

  }


  tradeBox.className =
    "tradeBox "
    +
    cssClass;


  tradeBox.innerHTML =
    classification
    +
    '<div class="discount">'
    +
    "Ask "
    +
    formatPrice(ask)
    +
    " • Discount "
    +
    formatPrice(discount)
    +
    "</div>";

}


/*
==================================================
RESULT
==================================================
*/


function renderResult(){

  timeValue.textContent =
    minutesRemaining
    +
    " min";


  scoreValue.textContent =
    formatScore(
      scoreDifferential
    );


  const result =
    getBreakEven();


  breakEven.textContent =
    formatPrice(
      result.cents
    );


  winProb.textContent =
    "Modeled win probability "
    +
    (
      result.probability
      *
      100
    ).toFixed(1)
    +
    "%";


  renderTradeClassification(
    result.cents
  );


  footer.textContent =
    currentModel()
      .label
    +
    " • Research estimates, not proof of profitable trades.";

}


/*
==================================================
SPORT BUTTONS
==================================================
*/


document
  .querySelectorAll(
    "#sportButtons button"
  )
  .forEach(
    button=>{

      button.addEventListener(
        "click",
        ()=>{

          sport =
            button
              .dataset
              .sport;


          document
            .querySelectorAll(
              "#sportButtons button"
            )
            .forEach(
              b=>{

                b
                  .classList
                  .toggle(
                    "active",
                    b === button
                  );

              }
            );


          probabilityLabel =
            Object.keys(
              currentModel()
                .probabilities
            )[0];


          renderProbabilityButtons();

          renderResult();

        }
      );

    }
  );


/*
==================================================
TIME SLIDER
==================================================
*/


timeSlider.addEventListener(
  "input",
  ()=>{

    minutesRemaining =
      Number(
        timeSlider.value
      );


    renderResult();

  }
);


/*
==================================================
SCORE SLIDER
==================================================
*/


scoreSlider.addEventListener(
  "input",
  ()=>{

    scoreDifferential =
      Number(
        scoreSlider.value
      );


    renderResult();

  }
);


/*
==================================================
KALSHI ASK
==================================================
*/


askInput.addEventListener(
  "input",
  ()=>{

    renderResult();

  }
);


/*
==================================================
START
==================================================
*/


renderProbabilityButtons();

renderResult();

</script>

</body>
</html>
