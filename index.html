<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">

<title>Football Fair-Price Lookup</title>

<style>

:root{
  --bg:#0b1220;
  --panel:#111827;
  --panel2:#15243b;
  --border:#2a3850;
  --text:#f8fafc;
  --muted:#9fb0c5;
  --accent:#5ea3ff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  padding:16px 12px 30px;
}

.wrap{
  max-width:720px;
  margin:auto;
}

h1{
  margin:0 0 5px;
  font-size:24px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:16px;
}

.label{
  font-size:13px;
  font-weight:800;
  margin:18px 0 8px;
}

.grid{
  display:grid;
  gap:8px;
}

.sports{
  grid-template-columns:1fr 1fr;
}

.probs{
  grid-template-columns:repeat(2,1fr);
}

.quarters{
  grid-template-columns:repeat(4,1fr);
}

button{
  appearance:none;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:11px;
  padding:12px 7px;
  min-height:46px;
  font-size:14px;
  font-weight:800;
}

button.active{
  background:var(--panel2);
  outline:2px solid var(--accent);
}

.scoreCard{
  margin-top:18px;
  padding:16px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:14px;
}

.scoreTitle{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.scoreValue{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin:4px 0 10px;
}

input[type="range"]{
  width:100%;
  margin:10px 0 3px;
}

.rangeEnds{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
}

.result{
  margin-top:18px;
  padding:20px 12px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  text-align:center;
}

.resultLabel{
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.price{
  font-size:52px;
  line-height:1.05;
  font-weight:950;
  margin-top:7px;
}

.message{
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
  min-height:16px;
}

@media(min-width:560px){
  .probs{
    grid-template-columns:repeat(4,1fr);
  }
}

</style>
</head>

<body>

<div class="wrap">

<h1>Football Fair-Price Lookup</h1>

<div class="sub">
Break-even YES prices include a 1.5% fee.
</div>


<div class="label">Sport</div>

<div class="grid sports" id="sportButtons">

<button
  type="button"
  data-sport="nfl"
  class="active">
NFL
</button>

<button
  type="button"
  data-sport="cfb">
College Top 25
</button>

</div>


<div class="label">
Pregame favorite probability
</div>

<div
  class="grid probs"
  id="probButtons">
</div>


<div class="label">
Quarter
</div>

<div
  class="grid quarters"
  id="quarterButtons">

<button type="button" data-quarter="Q1" class="active">Q1</button>
<button type="button" data-quarter="Q2">Q2</button>
<button type="button" data-quarter="Q3">Q3</button>
<button type="button" data-quarter="Q4">Q4</button>

</div>


<div class="scoreCard">

<div class="scoreTitle">
Favorite score differential
</div>

<div
  class="scoreValue"
  id="scoreValue">
+1
</div>

<input
  id="scoreSlider"
  type="range"
  min="-3"
  max="12"
  step="1"
  value="1">

<div class="rangeEnds">
<span>-3</span>
<span>0</span>
<span>+12</span>
</div>

</div>


<div class="result">

<div class="resultLabel">
Break-even YES price
</div>

<div
  class="price"
  id="price">
60¢
</div>

<div
  class="message"
  id="message">
</div>

</div>

</div>


<script>

/* ================================
   NFL VALIDATED BUCKET VALUES
   ================================ */

const NFL = {

"50–64%":{
  "Q1":{"1–3":60,"4–7":71,"8+":82},
  "Q2":{"1–3":64,"4–7":72,"8+":87},
  "Q3":{"1–3":65,"4–7":74,"8+":91},
  "Q4":{"1–3":73,"4–7":82,"8+":96}
},

"65–74%":{
  "Q1":{"1–3":72,"4–7":82,"8+":89},
  "Q2":{"1–3":72,"4–7":80,"8+":93},
  "Q3":{"1–3":69,"4–7":80,"8+":94},
  "Q4":{"1–3":68,"4–7":83,"8+":96}
},

"75–84%":{
  "Q1":{"1–3":79,"4–7":87,"8+":93},
  "Q2":{"1–3":80,"4–7":85,"8+":93},
  "Q3":{"1–3":75,"4–7":81,"8+":96},
  "Q4":{"1–3":75,"4–7":85,"8+":97}
},

"85%+":{
  "Q1":{"1–3":88,"4–7":94,"8+":93},
  "Q2":{"1–3":84,"4–7":88,"8+":94},
  "Q3":{"1–3":84,"4–7":89,"8+":96},
  "Q4":{"1–3":84,"4–7":90,"8+":98}
}

};


/* ==========================================
   COLLEGE SCORE-BY-SCORE SMOOTHED FAIR PRICE
   +1 THROUGH +12
   ========================================== */

const CFB = {

"50–69%":{

"Q1":{
1:67.2,2:68.3,3:69.3,4:75.1,
5:76.6,6:78.1,7:79.5,8:81.0,
9:82.5,10:84.1,11:88.4,12:88.4
},

"Q2":{
1:67.5,2:67.5,3:67.5,4:70.4,
5:70.4,6:71.9,7:77.4,8:79.4,
9:80.8,10:85.1,11:87.2,12:87.2
},

"Q3":{
1:58.7,2:69.4,3:69.4,4:71.0,
5:73.2,6:75.4,7:77.7,8:83.8,
9:84.8,10:85.8,11:86.3,12:86.3
},

"Q4":{
1:62.2,2:64.5,3:74.1,4:81.4,
5:85.4,6:86.5,7:86.5,8:86.5,
9:91.8,10:94.9,11:94.9,12:97.0
}

},


"70–84%":{

"Q1":{
1:76.9,2:76.9,3:76.9,4:81.1,
5:82.8,6:84.4,7:86.1,8:87.4,
9:88.8,10:90.1,11:90.1,12:90.1
},

"Q2":{
1:73.0,2:74.0,3:76.5,4:83.5,
5:83.5,6:83.5,7:86.3,8:86.3,
9:86.7,10:88.3,11:88.3,12:88.3
},

"Q3":{
1:70.8,2:70.8,3:73.1,4:75.8,
5:76.7,6:77.5,7:83.7,8:83.7,
9:83.7,10:89.8,11:92.1,12:92.1
},

"Q4":{
1:64.5,2:70.2,3:75.9,4:78.3,
5:80.7,6:83.3,7:84.0,8:95.2,
9:95.8,10:95.8,11:95.8,12:98.0
}

},


"85–94%":{

"Q1":{
1:84.9,2:84.9,3:84.9,4:86.4,
5:88.7,6:91.0,7:92.8,8:93.5,
9:94.2,10:94.8,11:95.5,12:95.5
},

"Q2":{
1:84.1,2:84.4,3:84.6,4:87.4,
5:87.5,6:88.3,7:91.3,8:91.3,
9:91.3,10:91.3,11:94.2,12:94.2
},

"Q3":{
1:81.7,2:81.7,3:81.7,4:81.7,
5:85.1,6:86.2,7:87.3,8:89.4,
9:91.6,10:91.8,11:93.7,12:93.7
},

"Q4":{
1:78.7,2:79.0,3:79.3,4:84.0,
5:86.8,6:89.7,7:92.6,8:95.1,
9:95.4,10:95.4,11:95.4,12:97.1
}

},


"95%+":{
  
"Q1":{
1:95.2,2:95.2,3:95.2,4:95.2,
5:95.3,6:96.0,7:96.8,8:96.8,
9:96.9,10:96.9,11:96.9,12:96.9
},

"Q2":{
1:92.9,2:92.9,3:92.9,4:92.9,
5:92.9,6:92.9,7:95.1,8:95.5,
9:95.5,10:95.9,11:96.3,12:96.3
},

"Q3":{
1:85.1,2:85.1,3:85.4,4:89.2,
5:90.7,6:92.3,7:93.5,8:93.5,
9:94.8,10:94.8,11:95.8,12:95.8
},

"Q4":{
1:83.0,2:83.0,3:83.0,4:92.9,
5:92.9,6:92.9,7:92.9,8:94.8,
9:97.0,10:97.0,11:97.2,12:97.7
}

}

};


const CONFIG = {

nfl:{
  probabilities:[
    "50–64%",
    "65–74%",
    "75–84%",
    "85%+"
  ]
},

cfb:{
  probabilities:[
    "50–69%",
    "70–84%",
    "85–94%",
    "95%+"
  ]
}

};


let sport = "nfl";
let probability = "50–64%";
let quarter = "Q1";
let score = 1;


const probButtons =
  document.getElementById("probButtons");

const scoreSlider =
  document.getElementById("scoreSlider");

const scoreValue =
  document.getElementById("scoreValue");

const price =
  document.getElementById("price");

const message =
  document.getElementById("message");


function formatScore(value){

  if(value > 0){
    return "+" + value;
  }

  return String(value);

}


function formatPrice(value){

  if(value === null){
    return "—";
  }

  const rounded =
    Math.round(value * 10) / 10;

  if(Number.isInteger(rounded)){
    return rounded.toFixed(0) + "¢";
  }

  return rounded.toFixed(1) + "¢";

}


function nflPrice(){

  if(score <= 0){
    return null;
  }

  let leadBucket;

  if(score <= 3){
    leadBucket = "1–3";
  }
  else if(score <= 7){
    leadBucket = "4–7";
  }
  else{
    leadBucket = "8+";
  }

  return NFL
    [probability]
    [quarter]
    [leadBucket];

}


function collegePrice(){

  if(score <= 0){
    return null;
  }

  return CFB
    [probability]
    [quarter]
    [score] ?? null;

}


function currentPrice(){

  if(sport === "nfl"){
    return nflPrice();
  }

  return collegePrice();

}


function renderProbabilityButtons(){

  probButtons.innerHTML = "";

  CONFIG[sport]
    .probabilities
    .forEach(p => {

      const button =
        document.createElement("button");

      button.type = "button";
      button.textContent = p;

      if(p === probability){
        button.classList.add("active");
      }

      button.addEventListener(
        "click",
        () => {

          probability = p;

          renderProbabilityButtons();
          renderResult();

        }
      );

      probButtons.appendChild(button);

    });

}


function renderResult(){

  scoreValue.textContent =
    formatScore(score);

  const value =
    currentPrice();

  price.textContent =
    formatPrice(value);

  if(score <= 0){

    message.textContent =
      "Tied/trailing state not yet validated.";

  }
  else if(sport === "nfl"){

    message.textContent =
      "";

  }
  else{

    message.textContent =
      "";

  }

}


document
  .querySelectorAll("#sportButtons button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        sport =
          button.dataset.sport;

        document
          .querySelectorAll("#sportButtons button")
          .forEach(b =>
            b.classList.toggle(
              "active",
              b === button
            )
          );

        probability =
          CONFIG[sport]
          .probabilities[0];

        renderProbabilityButtons();
        renderResult();

      }
    );

  });


document
  .querySelectorAll("#quarterButtons button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        quarter =
          button.dataset.quarter;

        document
          .querySelectorAll("#quarterButtons button")
          .forEach(b =>
            b.classList.toggle(
              "active",
              b === button
            )
          );

        renderResult();

      }
    );

  });


scoreSlider.addEventListener(
  "input",
  () => {

    score =
      Number(scoreSlider.value);

    renderResult();

  }
);


renderProbabilityButtons();
renderResult();

</script>

</body>
</html>
