<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">

<title>Football Fair-Price Lookup</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111827;
  --panel2:#15243b;
  --border:#2a3850;
  --text:#f8fafc;
  --muted:#9fb0c5;
  --accent:#5ea3ff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  padding:16px 12px 30px;
}

.wrap{
  max-width:720px;
  margin:auto;
}

h1{
  margin:0 0 5px;
  font-size:24px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:16px;
}

.label{
  font-size:13px;
  font-weight:800;
  margin:18px 0 8px;
}

.grid{
  display:grid;
  gap:8px;
}

.sports{
  grid-template-columns:1fr 1fr;
}

.probs{
  grid-template-columns:repeat(2,1fr);
}

.quarters{
  grid-template-columns:repeat(4,1fr);
}

button{
  appearance:none;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:11px;
  padding:12px 7px;
  min-height:46px;
  font-size:14px;
  font-weight:800;
}

button.active{
  background:var(--panel2);
  outline:2px solid var(--accent);
}

.scoreCard{
  margin-top:18px;
  padding:18px 16px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:14px;
}

.scoreTitle{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.scoreValue{
  text-align:center;
  font-size:38px;
  font-weight:950;
  margin:5px 0 12px;
}

input[type="range"]{
  width:100%;
  margin:10px 0 4px;
}

.rangeEnds{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
}

.result{
  margin-top:18px;
  padding:22px 12px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  text-align:center;
}

.resultLabel{
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.price{
  font-size:56px;
  line-height:1.05;
  font-weight:950;
  margin-top:8px;
}

.estimate{
  font-size:11px;
  color:var(--muted);
  margin-top:7px;
  min-height:14px;
}

@media(min-width:560px){
  .probs{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>Football Fair-Price Lookup</h1>

<div class="sub">
Break-even YES prices include a 1.5% fee.
</div>


<div class="label">Sport</div>

<div class="grid sports" id="sportButtons">

<button
  type="button"
  data-sport="nfl"
  class="active">
NFL
</button>

<button
  type="button"
  data-sport="cfb">
College Top 25
</button>

</div>


<div class="label">
Pregame favorite probability
</div>

<div
  class="grid probs"
  id="probButtons">
</div>


<div class="label">
Quarter
</div>

<div
  class="grid quarters"
  id="quarterButtons">

<button type="button" data-quarter="Q1" class="active">Q1</button>
<button type="button" data-quarter="Q2">Q2</button>
<button type="button" data-quarter="Q3">Q3</button>
<button type="button" data-quarter="Q4">Q4</button>

</div>


<div class="scoreCard">

<div class="scoreTitle">
Favorite score differential
</div>

<div
  class="scoreValue"
  id="scoreValue">
+1
</div>

<input
  id="scoreSlider"
  type="range"
  min="-3"
  max="12"
  step="1"
  value="1">

<div class="rangeEnds">
<span>-3</span>
<span>0</span>
<span>+12</span>
</div>

</div>


<div class="result">

<div class="resultLabel">
Break-even YES price
</div>

<div
  class="price"
  id="price">
—
</div>

<div
  class="estimate"
  id="estimate">
</div>

</div>

</div>


<script>

/*
==================================================
HISTORICAL FAIR-PRICE ANCHORS

The slider does NOT jump between these buckets.

Instead, these historical values are used as
anchor points for a smooth monotonic curve.

All prices already include the 1.5% fee.
==================================================
*/


const NFL = {

"50–64%":{
  "Q1":[60,71,82],
  "Q2":[64,72,87],
  "Q3":[65,74,91],
  "Q4":[73,82,96]
},

"65–74%":{
  "Q1":[72,82,89],
  "Q2":[72,80,93],
  "Q3":[69,80,94],
  "Q4":[68,83,96]
},

"75–84%":{
  "Q1":[79,87,93],
  "Q2":[80,85,93],
  "Q3":[75,81,96],
  "Q4":[75,85,97]
},

"85%+":{
  "Q1":[88,94,93],
  "Q2":[84,88,94],
  "Q3":[84,89,96],
  "Q4":[84,90,98]
}

};


/*
College anchor order:

anchor 1 = lead 1–3
anchor 2 = lead 4–7
anchor 3 = lead 8–14
*/

const CFB = {

"50–69%":{
  "Q1":[69.0,79.0,86.4],
  "Q2":[67.5,75.9,86.4],
  "Q3":[65.5,74.9,87.2],
  "Q4":[69.5,84.8,95.1]
},

"70–84%":{
  "Q1":[76.9,85.2,91.4],
  "Q2":[75.4,85.7,90.1],
  "Q3":[72.8,78.8,89.9],
  "Q4":[73.1,83.2,96.3]
},

"85–94%":{
  "Q1":[84.5,92.2,95.3],
  "Q2":[84.4,89.2,93.9],
  "Q3":[82.0,85.4,93.5],
  "Q4":[79.0,90.2,96.0]
},

"95%+":{
  "Q1":[96.3,96.5,97.4],
  "Q2":[92.9,94.5,96.6],
  "Q3":[85.0,92.3,95.1],
  "Q4":[82.7,92.9,97.2]
}

};


const CONFIG = {

nfl:{
  probabilities:[
    "50–64%",
    "65–74%",
    "75–84%",
    "85%+"
  ],

  /*
  Approximate centers of historical NFL
  lead groups:

  1–3  -> 2
  4–7  -> 5.5
  8+   -> 10

  10 is used as the practical center of the
  8+ region for our -3 through +12 slider.
  */

  x:[2,5.5,10]
},

cfb:{
  probabilities:[
    "50–69%",
    "70–84%",
    "85–94%",
    "95%+"
  ],

  /*
  College group centers:

  1–3   -> 2
  4–7   -> 5.5
  8–14  -> 11
  */

  x:[2,5.5,11]
}

};


let sport="nfl";
let probability="50–64%";
let quarter="Q1";
let score=1;


const probButtons=
  document.getElementById("probButtons");

const scoreSlider=
  document.getElementById("scoreSlider");

const scoreValue=
  document.getElementById("scoreValue");

const price=
  document.getElementById("price");

const estimate=
  document.getElementById("estimate");


function formatScore(value){

  if(value>0){
    return "+"+value;
  }

  return String(value);

}


function formatPrice(value){

  value=
    Math.max(
      1,
      Math.min(
        99,
        value
      )
    );

  const rounded=
    Math.round(value*10)/10;

  if(Number.isInteger(rounded)){
    return rounded.toFixed(0)+"¢";
  }

  return rounded.toFixed(1)+"¢";

}


/*
==================================================
MONOTONE CUBIC INTERPOLATION

This creates a curved transition instead of
straight bucket jumps.

It is based on a monotone cubic Hermite curve,
which prevents the fitted price from oscillating
wildly between historical anchor points.
==================================================
*/


function endpointSlope(h0,h1,d0,d1){

  let m=
    (
      (2*h0+h1)*d0
      -
      h0*d1
    )
    /
    (h0+h1);

  if(
    Math.sign(m)!==
    Math.sign(d0)
  ){
    m=0;
  }

  else if(
    Math.sign(d0)!==
    Math.sign(d1)
    &&
    Math.abs(m)>
    Math.abs(3*d0)
  ){
    m=3*d0;
  }

  return m;

}


function middleSlope(h0,h1,d0,d1){

  if(
    d0===0 ||
    d1===0 ||
    Math.sign(d0)!==
    Math.sign(d1)
  ){
    return 0;
  }

  const w1=
    2*h1+h0;

  const w2=
    h1+2*h0;

  return
    (w1+w2)
    /
    (
      w1/d0
      +
      w2/d1
    );

}


function hermite(
  x,
  x0,
  x1,
  y0,
  y1,
  m0,
  m1
){

  const h=
    x1-x0;

  const t=
    (x-x0)/h;

  const t2=
    t*t;

  const t3=
    t2*t;

  const h00=
    2*t3-3*t2+1;

  const h10=
    t3-2*t2+t;

  const h01=
    -2*t3+3*t2;

  const h11=
    t3-t2;

  return (
    h00*y0
    +
    h10*h*m0
    +
    h01*y1
    +
    h11*h*m1
  );

}


function smoothFairPrice(
  score,
  anchors,
  xs
){

  /*
  Force historical anchors to be non-decreasing.

  This removes tiny sample-driven reversals,
  such as 94 -> 93, that do not make football
  sense as the favorite's lead increases.
  */

  let y0=anchors[0];

  let y1=
    Math.max(
      anchors[1],
      y0
    );

  let y2=
    Math.max(
      anchors[2],
      y1
    );


  const x0=xs[0];
  const x1=xs[1];
  const x2=xs[2];

  const h0=
    x1-x0;

  const h1=
    x2-x1;

  const d0=
    (y1-y0)/h0;

  const d1=
    (y2-y1)/h1;


  let m0=
    endpointSlope(
      h0,
      h1,
      d0,
      d1
    );

  const m1=
    middleSlope(
      h0,
      h1,
      d0,
      d1
    );

  let m2=
    endpointSlope(
      h1,
      h0,
      d1,
      d0
    );


  /*
  Conservative extrapolation outside the
  historical anchor range.

  Trailing/tied values use only 65% of the
  fitted left-hand slope.

  Above the final anchor we use only 35%
  of the final slope.
  */

  if(score<x0){

    const leftSlope=
      Math.max(
        0,
        m0*0.65
      );

    return (
      y0
      +
      leftSlope*
      (score-x0)
    );

  }


  if(score<=x1){

    return hermite(
      score,
      x0,
      x1,
      y0,
      y1,
      m0,
      m1
    );

  }


  if(score<=x2){

    return hermite(
      score,
      x1,
      x2,
      y1,
      y2,
      m1,
      m2
    );

  }


  const rightSlope=
    Math.max(
      0,
      m2*0.35
    );

  return (
    y2
    +
    rightSlope*
    (score-x2)
  );

}


function currentAnchors(){

  if(sport==="nfl"){

    return NFL
      [probability]
      [quarter];

  }

  return CFB
    [probability]
    [quarter];

}


function getFairPrice(){

  const anchors=
    currentAnchors();

  const xs=
    CONFIG[sport].x;

  return smoothFairPrice(
    score,
    anchors,
    xs
  );

}


function renderProbabilityButtons(){

  probButtons.innerHTML="";

  CONFIG[sport]
    .probabilities
    .forEach(p=>{

      const button=
        document.createElement(
          "button"
        );

      button.type="button";

      button.textContent=p;

      if(p===probability){
        button.classList.add(
          "active"
        );
      }

      button.addEventListener(
        "click",
        ()=>{

          probability=p;

          renderProbabilityButtons();

          renderResult();

        }
      );

      probButtons.appendChild(
        button
      );

    });

}


function renderResult(){

  scoreValue.textContent=
    formatScore(score);

  const value=
    getFairPrice();

  price.textContent=
    formatPrice(value);


  if(score<=0){

    estimate.textContent=
      "Trend estimate";

  }
  else{

    estimate.textContent="";

  }

}


document
  .querySelectorAll(
    "#sportButtons button"
  )
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        sport=
          button.dataset.sport;

        document
          .querySelectorAll(
            "#sportButtons button"
          )
          .forEach(b=>
            b.classList.toggle(
              "active",
              b===button
            )
          );

        probability=
          CONFIG[sport]
          .probabilities[0];

        renderProbabilityButtons();

        renderResult();

      }
    );

  });


document
  .querySelectorAll(
    "#quarterButtons button"
  )
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        quarter=
          button.dataset.quarter;

        document
          .querySelectorAll(
            "#quarterButtons button"
          )
          .forEach(b=>
            b.classList.toggle(
              "active",
              b===button
            )
          );

        renderResult();

      }
    );

  });


scoreSlider.addEventListener(
  "input",
  ()=>{

    score=
      Number(
        scoreSlider.value
      );

    renderResult();

  }
);


renderProbabilityButtons();

renderResult();

</script>

</body>
</html>
